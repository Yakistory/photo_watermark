// Watermark image upload（支持一次导入多张）
wmFileInput.addEventListener('change', () => {
  if (wmFileInput.files.length) handleWmImageFiles(wmFileInput.files);
});

async function handleWmImageFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;

  let ok = 0;
  for (const file of list) {
    if (!file.type.startsWith('image/')) { showToast(`「${file.name}」不是图片文件`, 'error'); continue; }
    const form = new FormData();
    form.append('file', file);
    try {
      const res = await fetch('/api/watermark/upload', { method: 'POST', body: form });
      let data = {};
      try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
      if (!res.ok || data.error) { showToast(data.error || `导入失败 (HTTP ${res.status})`, 'error'); continue; }
      addWmItem(data);
      ok++;
    } catch (e) {
      showToast('上传失败: ' + e.message, 'error');
    }
  }
  wmFileInput.value = '';
  if (!ok) return;

  watermarkType = 'image';
  renderWatermark();
  scheduleConfigSave();   // 新增的水印 id 也要进配置（下次刷新才知道有几张、摆在哪）
  showToast(ok > 1 ? `已导入 ${ok} 张水印，直接在预览图上拖动摆放` : '水印已导入，直接在预览图上拖动摆放', 'success');
}

function addWmItem(data) {
  const item = {
    key: 'wmk' + (++wmSeq),
    id: data.id,
    src: data.preview,
    natW: data.width || 1,
    natH: data.height || 1,
    x: 0.5,
    y: 0.5,
    scale: 0.3,
    rotation: 0,
    opacity: 128,
  };
  // 多张时错开摆放，避免叠在一起看不清
  const n = wmItems.length;
  if (n) {
    item.x = 0.28 + 0.18 * (n % 3);
    item.y = 0.3 + 0.18 * (Math.floor(n / 3) % 2);
  }
  wmItems.push(item);
  selectedWmKey = item.key;
  return item;
}

// 刷新页面后恢复 uploads/ 里已有的水印文件（前端状态会丢，文件不会）
async function restoreWmItems() {
  if (wmItems.length) return;
  try {
    const res = await fetch('/api/watermark/list');
    const data = await res.json();
    (data.items || []).forEach(it => addWmItem(it));
  } catch (e) {
    /* 恢复失败不影响主流程 */
  }
}

// ---------------------------------------------------------------------------
// 品牌贴图：上传/删除走独立接口（/api/brand/*），存 brands/ 且跨会话保留。
// 刻意不复用图片水印接口 —— 那样贴图会同时出现在「图片水印」列表里被拖到照片上，
// 还会把 waterMarkType 顶成 image（正在套的信息栏模板会被弹出去）。
// ---------------------------------------------------------------------------
let brandFileInput = null;

function pickBrandImage(key) {
  if (!brandFileInput) {
    brandFileInput = document.createElement('input');
    brandFileInput.type = 'file';
    brandFileInput.accept = 'image/png,image/jpeg,image/webp,image/*';
    brandFileInput.style.display = 'none';
    document.body.appendChild(brandFileInput);
  }
  brandFileInput.value = '';
  brandFileInput.onchange = () => {
    const f = brandFileInput.files && brandFileInput.files[0];
    if (f) uploadBrandImage(f, key);
  };
  brandFileInput.click();
}

async function uploadBrandImage(file, key) {
  if (!file.type.startsWith('image/')) { showToast('请选择图片文件（推荐透明底 PNG）', 'error'); return; }
  showToast('正在导入贴图...', '');
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/brand/upload', { method: 'POST', body: form });
    let data = {};
    try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
    if (!res.ok || data.error) { showToast(data.error || `导入失败 (HTTP ${res.status})`, 'error'); return; }
    await loadBrands();
    if (activePreset && key) {
      activePreset.params[key] = data.id;     // 传完直接给这个槽位套上并预览
      saveBrandChoice(key, data.id);
    }
    renderPresetUI();
    showToast(`贴图已导入：${data.name || data.id}`, 'success');
    if (currentImage) previewWatermark();
  } catch (e) {
    showToast('导入失败: ' + e.message, 'error');
  }
}

async function removeBrand(id) {
  if (!id) return;
  if (!window.confirm('删除这张品牌贴图？引用它的模板会自动回落到文字。')) return;
  try {
    const res = await fetch('/api/brand/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }
  } catch (e) {
    showToast('删除失败: ' + e.message, 'error');
    return;
  }
  await loadBrands();
  if (activePreset) {
    Object.keys(activePreset.params).forEach(k => {
      if (activePreset.params[k] === id) { activePreset.params[k] = ''; saveBrandChoice(k, ''); }
    });
  }
  renderPresetUI();
  showToast('贴图已删除', '');
  if (currentImage) previewWatermark();
}

async function handleFile(file) {
  if (!file.type.startsWith('image/')) { showToast('请选择图片文件', 'error'); return; }
  if (file.size > 100 * 1024 * 1024) { showToast('图片超过 100MB 上限，请压缩后再试', 'error'); return; }
  showToast('正在处理...', '');

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }

    currentImage = data.preview;
    imageInfo = data.image_info || null;
    exifData = data.exif_data;

    // Update preview
    $('#previewImage').src = data.preview;
    $('#uploadPlaceholder').style.display = 'none';
    $('#previewContainer').style.display = 'flex';
    uploadZone.classList.add('has-image');

    // Info bar
    $('#infoBar').style.display = 'flex';
    $('#infoSize').textContent = `${data.image_info.width} × ${data.image_info.height}`;
    $('#infoFormat').textContent = data.image_info.format;
    $('#infoMode').textContent = data.image_info.mode;

    renderExif(data.exif_data);
    await restoreWmItems();
    renderWatermark();
    // 恢复上次自动保存的参数（含图片水印的位置）；配置可能还在路上（用户手速快）
    await wmConfigReady;
    if (wmConfig) applyConfig(wmConfig);
    else if (activePreset) previewWatermark();
    if (!showExifRecoveryNotice(data.exif_recovered, data.exif_warnings)) {
      showToast('图片加载成功', 'success');
    }
  } catch (e) {
    showToast('上传失败: ' + e.message, 'error');
  }
}

// 上传后回显后端在 EXIF 里发现的问题：从缩略图 IFD 补回的相机信息 + 结构告警。
// 有内容时返回 true（调用方就不再弹「图片加载成功」，避免两条提示互相覆盖）。
function showExifRecoveryNotice(recovered, warnings) {
  const label = { make: '制造商', model: '型号', software: '软件', datetime: '日期时间', artist: '作者', copyright: '版权' };
  const parts = Object.entries(recovered || {})
    .filter(([, v]) => v)
    .map(([k, v]) => `${label[k] || k} ${v}`);
  const msgs = [];
  if (parts.length) msgs.push('已从缩略图 IFD 找回：' + parts.join(' · '));
  (warnings || []).forEach(w => msgs.push(w));
  if (!msgs.length) return false;
  console.debug('[exif] recovered', recovered, 'warnings', warnings);
  showToast(msgs.join(' ｜ '), parts.length ? 'success' : '');
  return true;
}

// EXIF rendering
function renderExif(data) {
  const container = $('#exifContent');
  const entries = Object.entries(data);

  const basicTags = ['相机制造商', '相机型号', '软件', '日期时间', '作者', '版权', '拍摄时间', '数字化时间', '时区偏移', '拍摄时区'];
  const cameraTags = ['曝光时间', '光圈值', 'ISO感光度', '焦距', '35mm等效焦距', '曝光补偿', '曝光模式', '测光模式', '闪光灯', '白平衡', '曝光程序', '光源', '快门速度值', '光圈值(APEX)', '数码变焦', '色彩空间'];
  const lensTags = ['镜头制造商', '镜头型号', '镜头规格', '镜头序列号'];
  const otherTags = ['方向', 'X分辨率', 'Y分辨率', '分辨率单位', '图像宽度', '图像高度'];

  // 核心身份字段：EXIF 里没有也要渲染成空输入框。
  // 上游平台做「去拍摄信息」会删掉这些标签，之前前端按「存在才渲染」直接不画行，
  // 用户既看不到、也没地方补录 —— 现在留空框 + 「缺失」徽章，非空即随「保存修改」写入新增标签。
  const coreTags = ['相机制造商', '相机型号', '软件', '日期时间', '拍摄时间', '数字化时间'];

  // 二进制块（MakerNote / PrintIM 等）不给 data-tag：不参与保存，避免写坏原始数据
  function renderRow(name, info) {
    if (!info) {
      return `<div class="exif-row">
        <label title="${name}">${name}</label>
        <div class="exif-field">
          <input type="text" class="missing" data-tag="${name}" data-raw="" placeholder="EXIF 中缺失，可直接填写">
          <span class="field-badge missing" title="这张图的 EXIF 里没有这个标签，可以手填后用「保存修改」写入">缺失</span>
        </div>
      </div>`;
    }
    if (info.binary) {
      return `<div class="exif-row">
        <label title="${name}">${name}</label>
        <input type="text" class="binary" value="${escapeHtml(info.formatted)}" readonly title="二进制数据，不支持编辑">
      </div>`;
    }
    // source=ifd1：主 IFD0 里被删了，值取自同一文件的缩略图 IFD，保存后写进主 IFD0
    const badge = info.source === 'ifd1'
      ? '<span class="field-badge src" title="主 IFD0 里该标签已被删除，此值取自同一文件的缩略图 IFD(IFD1)；点「保存修改」会写进主 IFD0">缩略图</span>'
      : '';
    return `<div class="exif-row">
      <label title="${name}">${name}</label>
      <div class="exif-field">
        <input type="text" value="${escapeHtml(info.formatted)}" data-tag="${name}" data-raw="${escapeHtml(info.raw)}">
        ${badge}
      </div>
    </div>`;
  }

  function renderSection(title, tags) {
    // 按标签清单的固定顺序渲染（顺序稳定），核心字段即便 EXIF 里没有也照样出一行
    const rows = tags
      .map(name => [name, data[name]])
      .filter(([name, info]) => info || coreTags.includes(name));
    if (rows.length === 0) return '';
    let html = `<div class="exif-section"><h3>${title}</h3>`;
    rows.forEach(([name, info]) => { html += renderRow(name, info); });
    html += '</div>';
    return html;
  }

  let html = '';
  if (entries.length === 0) {
    // 完全没有 EXIF 也照样给出核心身份字段（用户手填即可），而不是只显示一句「没有 EXIF」
    html += '<div class="empty-state"><p>该图片没有 EXIF 信息（可在下方直接填写相机信息，保存后写入）</p></div>';
  }
  html += renderSection('基础信息', basicTags);
  html += renderSection('拍摄参数', cameraTags);
  html += renderSection('镜头信息', lensTags);

  const remaining = entries.filter(([name]) => !basicTags.includes(name) && !cameraTags.includes(name) && !lensTags.includes(name) && !otherTags.includes(name));
  if (remaining.length > 0) {
    html += '<div class="exif-section"><h3>其他参数</h3>';
    remaining.forEach(([name, info]) => { html += renderRow(name, info); });
    html += '</div>';
  }

  html += '<div class="exif-actions"><button class="btn btn-primary" onclick="saveExif()">保存修改</button><button class="btn btn-secondary" onclick="resetExif()">重置</button></div>';
  container.innerHTML = html;
}

async function saveExif() {
  const edits = {};
  $$('#exifContent input[data-tag]').forEach(input => {
    const original = input.dataset.raw;
    const current = input.value;
    if (current !== original && current.trim()) {
      edits[input.dataset.tag] = current;
    }
  });

  if (Object.keys(edits).length === 0) { showToast('没有修改任何参数', ''); return; }

  try {
    const res = await fetch('/api/exif/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ edits })
    });
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }
    exifData = data.exif_data;
    renderExif(data.exif_data);
    showToast('EXIF 参数已更新', 'success');
  } catch (e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

function resetExif() {
  renderExif(exifData);
  showToast('已重置为原始数据', '');
}

// ---------------------------------------------------------------------------
// 模板 UI：控件全部按后端下发的 controls 描述生成（加模板/改数值不用动前端）
// ---------------------------------------------------------------------------
const presetScale = c => Number(c.scale || 1);
const presetChoiceLabel = v => PRESET_CHOICE_LABELS[v] || v;

function presetParamValue(key) {
  return activePreset ? activePreset.params[key] : undefined;
}

// ---------------------------------------------------------------------------
// 可选颜色（*_image_color）：**空值 = 跟随同槽位的文字颜色**
// 取值链：本键参数 → 同槽 {段}_color（信息栏四段 / 画框四行都是这个键名）→ 控件默认值
// ⇒ 老配置（没有这个键）读回来和以前逐像素一样，只有用户真的点了色盘才是「固定色」。
// ---------------------------------------------------------------------------
function optionalColorSeg(key) {
  return String(key || '').replace(/_image_color$/, '');
}

function optionalColorEffective(key, value) {
  const raw = (value === undefined) ? presetParamValue(key) : value;
  if (raw) return String(raw);
  const follow = presetParamValue(`${optionalColorSeg(key)}_color`);
  return follow ? String(follow) : '';
}

function optionalColorRefLabel(c) {
  return (c && (c.empty_label || c.label)) || '文字';
}

function presetActiveFor(type) {
  return !!activePreset && (PRESET_KIND_TO_TYPE[activePreset.kind] || '') === type;
}

function renderPresetUI() {
  const chips = $('#wmPresetChips');
  const box = $('#wmPresetControls');
  if (!chips || !box) return;

  chips.innerHTML = [
    `<div class="wm-preset-chip ${activePreset ? '' : 'active'}" data-preset="" title="不使用模板，沿用默认排版">默认样式</div>`,
    ...wmPresets.map(p => `<div class="wm-preset-chip ${activePreset && activePreset.id === p.id ? 'active' : ''}" data-preset="${escapeHtml(p.id)}" title="${escapeHtml(p.description || '')}">${escapeHtml(p.name)}</div>`),
  ].join('');
  chips.querySelectorAll('.wm-preset-chip').forEach(el => {
    el.addEventListener('click', () => applyPreset(el.dataset.preset));
  });

  box.innerHTML = activePreset ? presetControlsHtml(activePreset) : '';
  bindPresetControls();
}

function presetControlsHtml(preset) {
  const groups = new Map();
  (preset.controls || []).forEach(c => {
    const g = c.group || '参数';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);
  });
  let html = '';
  for (const [name, list] of groups) {
    html += `<div class="wm-preset-group"><div class="wm-preset-group-title">${escapeHtml(name)}</div>`;
    html += list.map(controlHtml).join('');
    html += '</div>';
  }
  return html;
}

function controlHtml(c) {
  const id = `wmp_${c.key}`;
  const hint = c.hint ? `<span class="wm-hint-inline">${escapeHtml(c.hint)}</span>` : '';
  // 初值优先取工作副本；模板 params 里没写这个键时退回后端下发的 value
  // （＝spec 默认值）——否则 float 会显示量程下限、bool 会显示未勾选
  const raw = presetParamValue(c.key) ?? c.value;
  if (c.type === 'choice') {
    return `<div class="wm-group"><label>${escapeHtml(c.label)}</label>
      <select id="${id}" data-key="${c.key}">${(c.choices || []).map(ch =>
        `<option value="${escapeHtml(ch)}" ${ch === raw ? 'selected' : ''}>${escapeHtml(presetChoiceLabel(ch))}</option>`).join('')}</select></div>`;
  }
  if (c.type === 'color') {
    // 可选颜色（c.optional，目前只有 *_image_color）：**空值 = 跟随同槽位文字颜色**。
    // 空串没法用 <input type=color> 表达（它会显示成 #000000，一碰就写值），所以这里补
    // 一行状态 + 一个「跟随文字颜色」按钮；按钮**不带 data-key** —— 同贴图/字体按钮的
    // 规矩，否则会被通用绑定当模板参数写进 payload。
    if (c.optional) {
      const cur = String(raw || '');
      const eff = optionalColorEffective(c.key, cur) || '#000000';
      const state = cur
        ? `<span class="wm-brand-meta">固定 ${escapeHtml(cur)}</span>`
        : `<span class="wm-brand-meta">跟随「${escapeHtml(optionalColorRefLabel(c))}」${escapeHtml(eff)}</span>`;
      return `<div class="wm-group"><label>${escapeHtml(c.label)}${hint}</label>
      <div class="wm-color-row"><input type="color" id="${id}" data-key="${c.key}" value="${escapeHtml(eff)}"></div>
      <div class="wm-brand-state">${state}
        <button type="button" class="wm-mini-btn" data-role="color-follow" data-color-key="${c.key}">跟随文字颜色</button>
      </div></div>`;
    }
    return `<div class="wm-group"><label>${escapeHtml(c.label)}${hint}</label>
      <div class="wm-color-row"><input type="color" id="${id}" data-key="${c.key}" value="${escapeHtml(String(raw || '#ffffff'))}"></div></div>`;
  }
  if (c.type === 'bool') {
    return `<div class="wm-group"><label class="wm-checkbox"><input type="checkbox" id="${id}" data-key="${c.key}" ${raw ? 'checked' : ''}> ${escapeHtml(c.label)}</label></div>`;
  }
  if (c.type === 'text') {
    return `<div class="wm-group"><label>${escapeHtml(c.label)}${hint}</label>
      <input type="text" id="${id}" data-key="${c.key}" value="${escapeHtml(String(raw || ''))}"></div>`;
  }
  if (c.type === 'image_ref') {
    // 品牌贴图槽位：状态行（当前贴图 + 上传/用文字/删除）+ 库缩略图条（点一下就套用到本槽位）。
    // 传的是贴图 id，后端还会按 ^[0-9a-zA-Z]{1,32}$ 再校验一次。
    const cur = String(raw || '');
    const found = wmBrands.find(b => b.id === cur);
    const tip = brandNeedHint(c.key);
    const strip = wmBrands.map(b => {
      const on = b.id === cur ? ' active' : '';
      const title = `${b.name}（${b.width}×${b.height}）${b.id === cur ? ' · 点击取消（改用文字）' : ' · 点击套用到此处'}`;
      return `<button type="button" class="wm-brand-pick${on}" data-role="brand-pick" data-brand-key="${c.key}" data-brand-id="${escapeHtml(b.id)}" title="${escapeHtml(title)}">`
        + `<img src="${b.preview}" alt="${escapeHtml(b.name)}"></button>`;
    }).join('');
    // 引用的贴图不在库里（被删掉 / 换了机器）：留一个占位格，点「用文字」即可清掉
    const ghost = (cur && !found)
      ? `<button type="button" class="wm-brand-pick active" data-role="brand-pick" data-brand-key="${c.key}" data-brand-id="${escapeHtml(cur)}" title="${escapeHtml(cur)}（不在贴图库里，点击清除）">?</button>`
      : '';
    const state = found
      ? `<img class="wm-brand-thumb" src="${found.preview}" alt="">`
        + `<span class="wm-brand-meta">${escapeHtml(found.name)} · ${found.width}×${found.height}`
        + `${found.source ? ' · 来自 brands/ 目录' : ''}${escapeHtml(tip)}</span>`
      : `<span class="wm-brand-empty">未使用贴图（该段照旧用文字）</span><span class="wm-brand-meta"></span>`;
    const empty = wmBrands.length ? ''
      : '<div class="wm-brand-empty">还没有贴图：点「+」或「上传贴图」导入透明底 PNG。</div>';
    // 照片 logo 多一个「在图上拖动」入口：位置/大小直接在预览图上拖（0 请求，松手才合成）
    const dragBtn = c.key === 'photo_logo'
      ? `<button type="button" class="wm-mini-btn" data-role="logo-drag" id="wmpPhotoLogoDrag" title="在预览图上拖动摆放（拖右下角圆点改大小）">${logoDragging ? '完成拖动' : '在图上拖动'}</button>`
      : '';
    const dragHint = c.key === 'photo_logo'
      ? '<div class="wm-hint-inline">点「在图上拖动」可直接在预览图上拖摆；右下角圆点改大小、× 移除。位置是「照片内」的相对坐标，换尺寸或加画框都不会跑位。</div>'
      : '';
    return `<div class="wm-group"><label>${escapeHtml(c.label)}${hint}</label>
      <div class="wm-brand-state">
        ${state}
        <button type="button" class="wm-mini-btn" data-role="brand-upload" data-brand-key="${c.key}">上传贴图</button>
        <button type="button" class="wm-mini-btn" data-role="brand-clear" data-brand-key="${c.key}">用文字</button>
        ${found ? `<button type="button" class="wm-mini-btn danger" data-role="brand-delete" data-brand-id="${escapeHtml(cur)}">删除</button>` : ''}
        ${dragBtn}
      </div>
      <div class="wm-brand-strip">${strip}${ghost}
        <button type="button" class="wm-brand-add" data-role="brand-upload" data-brand-key="${c.key}" title="上传新贴图（透明底 PNG）">+</button>
      </div>
      ${empty}
      ${dragHint}
    </div>`;
  }
  if (c.type === 'font_ref') {
    // 字体槽位：下拉（系统字体按后端过滤后下发 + 我上传的）+ 上传/删除。
    // 值是字体 id（后端同样按 ^[0-9a-zA-Z]{1,32}$ 再校验一次），空串 = 自动挑体。
    return `<div class="wm-group"><label>${escapeHtml(c.label)}${hint}</label>
      <div class="wm-font-row">
        <select id="${id}" data-key="${c.key}">${fontOptionsHtml(c, String(raw || ''))}</select>
        <button type="button" class="wm-mini-btn" data-role="font-upload">上传字体</button>
        ${isUploadedFont(c, String(raw || '')) ? `<button type="button" class="wm-mini-btn danger" data-role="font-delete" data-font-id="${escapeHtml(String(raw || ''))}">删除</button>` : ''}
      </div>
      <span class="wm-hint-inline">${escapeHtml(fontStateText(c, String(raw || '')))}</span>
    </div>`;
  }
  if (c.type !== 'float' && c.type !== 'int') {
    // 未知控件类型：宁可什么都不画，也不渲染 min="NaN" 的坏滑块（老页面遇到新模板的典型症状）
    console.warn('[wm] 未知控件类型，已跳过:', c.type, c.key);
    return '';
  }
  // float / int → 滑块 + 数字框：显示值 = 真实值 × scale，单位文字也来自模板描述。
  // 两个控件共用同一套数值口径（range 是唯一真值来源，见 bindRangeNumber）：
  // 显示的是 %/‰ 这类人话单位，所以手输「10」= 10%，不是比例值 0.1。
  //
  // step 由后端按**显示小数位**下发（float=0.01，int=1）：range 的 value 会被浏览器
  // 吸附到 step 网格上，网格比显示精度粗就会出现「输什么都跳到特定数」——
  // 所以这里只允许「十进制整数格」，绝不用 (max-min)/N 这种算出来的怪step。
  const sc = presetScale(c);
  const min = roundTo(finiteNum(Number(c.min) * sc, 0), 6);
  const max = roundTo(finiteNum(Number(c.max) * sc, Math.max(min, 1)), 6);
  const step = c.type === 'int' ? 1 : finiteNum(c.step, finiteNum(Math.max(0.01, (max - min) / 200), 0.01));
  const shown = Math.min(max, Math.max(min, finiteNum(Number(raw) * sc, min)));
  const dec = c.type === 'int' ? 0 : numDecimals(step);
  const unit = c.unit || '';
  const numTitle = `可直接输入数字：${min}~${max}${unit}，回车或失焦生效`;
  return `<div class="wm-group"><label>${escapeHtml(c.label)}${hint}</label>
    <div class="wm-slider-row">
      <input type="range" id="${id}" data-key="${c.key}" min="${min}" max="${max}" step="${step}" value="${shown}">
      <input type="number" class="wm-num" id="${id}Num" data-num-for="${c.key}" min="${min}" max="${max}" step="${step}"
        inputmode="decimal" value="${roundTo(shown, dec)}" title="${escapeHtml(numTitle)}"
        aria-label="${escapeHtml(c.label)}（可直接输入）">
      ${unit ? `<span class="wm-unit">${escapeHtml(unit)}</span>` : ''}
    </div></div>`;
}

// 数值兜底：非有限值一律换成 fallback —— 页面上绝不出现 min="NaN" / value="NaN"
function finiteNum(v, fallback) {
  const n = Number(v);
  return isFinite(n) ? n : fallback;
}

// 显示小数位：从滑块的 step 推（step=0.24 → 2 位；整数控件 step=1 → 0 位）
function numDecimals(step) {
  const s = String(step == null ? '' : step);
  const dot = s.indexOf('.');
  return dot < 0 ? 0 : Math.min(3, s.length - dot - 1);
}

function roundTo(v, decimals) {
  return Number(finiteNum(v, 0).toFixed(finiteNum(decimals, 0)));
}

// 滑块 + 数字输入框 双向绑定 —— range 始终是唯一真值来源：
//   拖滑块    ⇒ 数字框跟着走（业务侧的 input 监听读的就是 range.value，这里只负责显示同步）
//   数字框手输 ⇒ 合法（在范围内）就写回 range 并即时生效；越界/非法先不动，
//               否则刚敲第一个字符就被夹紧、输入框会跟用户抢（经典坑）
//   失焦或回车（原生 change）⇒ 夹紧到 [min,max] + 按小数位归一显示；非法内容回到 range 当前值
// toDisplay / toRange：滑块值与人话单位不一致时才需要（透明度是 10~255 ↔ 4%~100%）
// commitOnRange：range 自带业务监听时为 false，避免同一次拖动触发两次提交
function bindRangeNumber(opts) {
  const range = opts.range;
  const num = opts.num;
  if (!range || !num) return;
  const toDisplay = opts.toDisplay || (v => v);
  const toRange = opts.toRange || (v => v);
  const decimals = opts.decimals == null ? numDecimals(range.step) : opts.decimals;
  const commit = opts.onCommit || (() => {});
  const lo = toDisplay(finiteNum(range.min, 0));
  const hi = toDisplay(finiteNum(range.max, 0));
  const showNum = () => { num.value = String(roundTo(toDisplay(finiteNum(range.value, 0)), decimals)); };
  const apply = v => { range.value = String(toRange(v)); commit(); };
  range.addEventListener('input', () => {
    showNum();
    if (opts.commitOnRange !== false) commit();
  });
  num.addEventListener('input', () => {
    const v = parseFloat(num.value);          // parseFloat 能吃下 "13.68%" 这种带单位的粘贴
    if (!isFinite(v)) return;                 // 空串 / 只有负号 → 等失焦再兜底
    if (v < Math.min(lo, hi) || v > Math.max(lo, hi)) return;
    apply(v);
  });
  num.addEventListener('change', () => {
    const v = parseFloat(num.value);
    if (isFinite(v)) apply(Math.min(Math.max(v, Math.min(lo, hi)), Math.max(lo, hi)));
    showNum();
  });
  showNum();
}

// 品牌贴图「建议 ≥N px 高」提示：信息栏引擎把贴图缩放到
// 墨迹高 = {段}_cap_ratio × font_scale × 画布宽，这里用**原图宽**反推出成片的目标像素高。
// 拿不到原图尺寸 / 模板没定义该段 cap_ratio 就不提示（纯提示，不影响渲染）。
function brandNeedHint(key) {
  const params = (activePreset && activePreset.params) || {};
  const w = (imageInfo && Number(imageInfo.width)) || 0;
  if (key === 'photo_logo') {
    // 照片 logo 按**照片宽**定尺寸（不是墨迹高），所以提示换成「建议 ≥N px 宽」
    const sc = Number(params.photo_logo_scale || 0);
    return (sc && w) ? ` · 建议 ≥${Math.round(sc * w)}px 宽` : '';
  }
  const seg = String(key || '').replace(/_image$/, '');
  const cap = Number(params[`${seg}_cap_ratio`] || 0);
  const scale = Number(params.font_scale || 1) || 1;
  if (!cap || !w) return '';
  return ` · 建议 ≥${Math.round(cap * scale * w)}px 高`;
}

function inputToParam(c, el) {
  if (c.type === 'bool') return el.checked;
  if (c.type === 'color' || c.type === 'text' || c.type === 'choice'
    || c.type === 'image_ref' || c.type === 'font_ref') return el.value;
  return Number(el.value) / presetScale(c);
}

function bindPresetControls() {
  const box = $('#wmPresetControls');
  if (!box || !activePreset) return;
  const byKey = {};
  (activePreset.controls || []).forEach(c => { byKey[c.key] = c; });
  box.querySelectorAll('[data-key]').forEach(el => {
    const c = byKey[el.dataset.key];
    if (!c) return;
    el.addEventListener(el.type === 'range' || el.type === 'color' ? 'input' : 'change', () => {
      activePreset.params[el.dataset.key] = inputToParam(c, el);
      debouncedPreview();
    });
  });
  // 数字手输框：与上面的滑块成对（range 始终是真值来源，这里只负责把数字写回 range）
  box.querySelectorAll('[data-num-for]').forEach(num => {
    const c = byKey[num.dataset.numFor];
    const range = c ? $(`#wmp_${c.key}`) : null;
    if (!c || !range) return;
    bindRangeNumber({
      range, num, commitOnRange: false,   // range 自己的 input 监听（上面那段）已经在提交了
      onCommit: () => { activePreset.params[c.key] = inputToParam(c, range); debouncedPreview(); },
    });
  });
  // 品牌贴图槽位：缩略图条（点击套用/取消）、上传、删除、改用文字。
  // 这些按钮一律不带 data-key —— 否则会被上面的通用逻辑当成控件丢进 inputToParam。
  box.querySelectorAll('[data-role="brand-pick"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.brandKey;
      const id = btn.dataset.brandId;
      // 点同一张 = 取消（回落到文字），点别的 = 换这张
      const next = String(activePreset.params[key] || '') === id ? '' : id;
      activePreset.params[key] = next;
      saveBrandChoice(key, next);
      renderPresetUI();
      if (currentImage) previewWatermark();
    });
  });
  box.querySelectorAll('[data-role="brand-clear"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.brandKey;
      activePreset.params[key] = '';
      saveBrandChoice(key, '');
      renderPresetUI();
      if (currentImage) previewWatermark();
    });
  });
  box.querySelectorAll('[data-role="brand-upload"]').forEach(btn => {
    btn.addEventListener('click', () => pickBrandImage(btn.dataset.brandKey));
  });
  box.querySelectorAll('[data-role="brand-delete"]').forEach(btn => {
    btn.addEventListener('click', () => removeBrand(btn.dataset.brandId));
  });
  // 字体槽位：上传（套到本行那个下拉上）/ 删除某个我上传的字体。
  // 同样不带 data-key，免得被上面的通用控件逻辑丢进 inputToParam。
  box.querySelectorAll('[data-role="font-upload"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = btn.closest('.wm-group');
      const sel = row ? row.querySelector('select[data-key]') : null;
      pickFontFile(sel ? sel.dataset.key : '');
    });
  });
  box.querySelectorAll('[data-role="font-delete"]').forEach(btn => {
    btn.addEventListener('click', () => removeFontFile(btn.dataset.fontId));
  });
  // 照片 logo 的「在图上拖动」：切换拖动模式（同样不带 data-key）
  box.querySelectorAll('[data-role="logo-drag"]').forEach(btn => {
    btn.addEventListener('click', () => toggleLogoDrag());
  });
  // 可选颜色（*_image_color）的「跟随文字颜色」：写回空串 = 交给该槽文字颜色。
  // 自动保存不用单独挂 —— previewWatermark() 那条链里已经有 scheduleConfigSave()。
  box.querySelectorAll('[data-role="color-follow"]').forEach(btn => {
    btn.addEventListener('click', () => {
      activePreset.params[btn.dataset.colorKey] = '';
      renderPresetUI();
      if (currentImage) previewWatermark(); else scheduleConfigSave();
    });
  });
}

// ---------------------------------------------------------------------------
// 照片 logo 的拖动模式：与图片水印同一套「DOM 代理层」思路 —— 拖动/缩放只改
// activePreset.params（0 请求、即时反馈），松手才让后端做权威合成。
// 落点用「照片盒」归一化坐标（0,0 = 照片左上），照片盒来自预览回显的
// applied.frame.photo_box ⇒ 改留白宽度之后拖动依然对得上。
// ---------------------------------------------------------------------------
let logoDragging = false;   // 是否处于「在图上拖动」模式
let lastApplied = null;     // 上次预览的 applied（frame.canvas / frame.photo_box / frame.photo_logo）

function logoParams() { return (activePreset && activePreset.params) || null; }
function logoBrandId() { const p = logoParams(); return p ? String(p.photo_logo || '') : ''; }
function logoLayerEl() { return $('#wmLogoLayer'); }
function logoCanShow() {
  // 照片 logo 只属于「照片上有留白/背景」的那两类水印（画框 / 背景模糊）：
  // 信息栏的贴图在图片下方那条栏里，不用拖。
  const isFramed = watermarkType === 'frame' || watermarkType === 'blur';
  return isFramed && presetActiveFor(watermarkType) && !!logoBrandId()
    && !!wmBrands.find(b => b.id === logoBrandId());
}

function hideLogoLayer() {
  const layer = logoLayerEl();
  if (!layer) return;
  layer.classList.remove('active');
  layer.innerHTML = '';
}

function showLogoLayer() {
  const layer = logoLayerEl();
  if (!layer) return;
  if (!logoCanShow()) { hideLogoLayer(); return; }
  const brand = wmBrands.find(b => b.id === logoBrandId());
  const node = document.createElement('div');
  node.className = 'wm-item selected';
  node.id = 'wmLogoNode';

  const img = document.createElement('img');
  img.src = brand.preview;
  img.alt = '';
  img.draggable = false;
  node.appendChild(img);

  const handle = document.createElement('div');
  handle.className = 'wm-handle';
  handle.title = '拖动改大小（宽度占照片宽）';
  node.appendChild(handle);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'wm-del';
  del.textContent = '×';
  del.title = '移除照片 logo';
  del.addEventListener('click', ev => {
    ev.stopPropagation();
    logoParams().photo_logo = '';
    saveBrandChoice('photo_logo', '');
    logoDragging = false;
    hideLogoLayer();
    renderPresetUI();
    scheduleConfigSave();
    if (currentImage) previewWatermark();
  });
  node.appendChild(del);

  node.addEventListener('pointerdown', ev => {
    if (ev.button !== undefined && ev.button !== 0) return;
    if (ev.target === handle) { startLogoResize(ev); return; }
    if (ev.target === del || del.contains(ev.target)) return;
    startLogoDrag(ev);
  });

  layer.innerHTML = '';
  layer.appendChild(node);
  layoutLogoLayer();
}

// 照片盒在屏幕上的矩形：优先用后端回显的 frame.photo_box / frame.canvas 换算；
// 还没预览过（没有 applied）就退回「整张预览图 = 照片」
function logoPhotoRect() {
  const img = $('#previewImage');
  const ir = img.getBoundingClientRect();
  const fr = (lastApplied && lastApplied.frame) || {};
  const box = fr.photo_box;
  const canvas = fr.canvas;
  if (!box || !canvas || !canvas[0] || !canvas[1]) {
    return { x: ir.left, y: ir.top, w: ir.width, h: ir.height };
  }
  const sx = ir.width / canvas[0];
  const sy = ir.height / canvas[1];
  return { x: ir.left + box[0] * sx, y: ir.top + box[1] * sy, w: box[2] * sx, h: box[3] * sy };
}

function layoutLogoLayer() {
  const layer = logoLayerEl();
  const box = $('#previewContainer');
  const img = $('#previewImage');
  if (!layer || !box || !img || !layer.classList.contains('active')) return;
  const ir = img.getBoundingClientRect();
  if (!ir.width || !ir.height) return;
  const cr = box.getBoundingClientRect();
  layer.style.left = (ir.left - cr.left - box.clientLeft) + 'px';
  layer.style.top = (ir.top - cr.top - box.clientTop) + 'px';
  layer.style.width = ir.width + 'px';
  layer.style.height = ir.height + 'px';
  layoutLogoNode();
}

// 显示尺寸：宽 = 照片宽 × photo_logo_scale；高按**后端实测的墨迹长宽比**推
// （out 的纵横比与 scale 无关，所以连续拖动缩放时不会变形）
function logoDisplaySize(pr) {
  const p = logoParams() || {};
  const w = pr.w * finiteNum(Number(p.photo_logo_scale), 0.25);
  const ap = lastApplied && lastApplied.bar && lastApplied.bar.photo_logo;
  let aspect = 0;
  if (ap && ap.out && ap.out[0] > 0 && ap.out[1] > 0) aspect = ap.out[1] / ap.out[0];
  if (!aspect) {
    const brand = wmBrands.find(b => b.id === logoBrandId());
    aspect = brand && brand.width ? brand.height / brand.width : 0.25;
  }
  return { w: w, h: w * aspect };
}

function layoutLogoNode() {
  const node = $('#wmLogoNode');
  const layer = logoLayerEl();
  const p = logoParams();
  if (!node || !layer || !p || !layer.classList.contains('active')) return;
  const pr = logoPhotoRect();
  if (!pr.w || !pr.h) return;
  const lr = layer.getBoundingClientRect();
  const size = logoDisplaySize(pr);
  const cx = pr.x + finiteNum(Number(p.photo_logo_x), 0.5) * pr.w;
  const cy = pr.y + finiteNum(Number(p.photo_logo_y), 0.5) * pr.h;
  node.style.left = (cx - size.w / 2 - lr.left) + 'px';
  node.style.top = (cy - size.h / 2 - lr.top) + 'px';
  node.style.width = size.w + 'px';
  node.style.height = size.h + 'px';
  // Pillow 的 rotate 是逆时针、CSS 是顺时针 ⇒ 取反才与后端一致（与图片水印同一条规矩）
  const rot = finiteNum(Number(p.photo_logo_rotation), 0);
  node.style.transform = rot ? `rotate(${-rot}deg)` : '';
}

// 拖动期间只改前端参数；松手才落盘 + 让后端权威合成
function logoDragWatch(onMove, ev) {
  const move = e => onMove(e);
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    scheduleConfigSave();
    if (currentImage) previewWatermark();
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  ev.preventDefault();
}

function startLogoDrag(ev) {
  const p = logoParams();
  if (!p) return;
  const pr = logoPhotoRect();
  const start = { x: ev.clientX, y: ev.clientY,
                  fx: finiteNum(Number(p.photo_logo_x), 0.5), fy: finiteNum(Number(p.photo_logo_y), 0.5) };
  logoDragWatch(e => {
    if (!pr.w || !pr.h) return;
    p.photo_logo_x = roundTo(clamp01(start.fx + (e.clientX - start.x) / pr.w), 4);
    p.photo_logo_y = roundTo(clamp01(start.fy + (e.clientY - start.y) / pr.h), 4);
    layoutLogoNode();
  }, ev);
}

function startLogoResize(ev) {
  const p = logoParams();
  if (!p) return;
  const pr = logoPhotoRect();
  const start = { x: ev.clientX, scale: finiteNum(Number(p.photo_logo_scale), 0.25) };
  logoDragWatch(e => {
    if (!pr.w) return;
    // 按**倍数**缩放：从任意起点拖都不会突然跳变
    const next = start.scale * (1 + (e.clientX - start.x) / Math.max(40, pr.w * start.scale));
    p.photo_logo_scale = roundTo(Math.min(1, Math.max(0.02, next)), 4);
    layoutLogoNode();
  }, ev);
}

function toggleLogoDrag() {
  logoDragging = !logoDragging;
  renderPresetUI();     // 按钮文案在「在图上拖动 / 完成拖动」之间切换
  if (!logoDragging) {
    hideLogoLayer();
    if (currentImage) previewWatermark();
    return;
  }
  if (!logoCanShow()) {
    showToast('先在「照片 logo」里选一张贴图', 'error');
    logoDragging = false;
    renderPresetUI();
    return;
  }
  // 先预览一次拿到权威几何（photo_box），代理层才能和后端严丝合缝
  if (currentImage) previewWatermark(); else showLogoLayer();
  showToast('在预览图上拖动摆放；右下角圆点改大小，完成后点「完成拖动」', '');
}


// 用户点模板时会带回「上次选过的品牌贴图」；套用配置时**不带回** —— 配置里的空值
// 就是用户当初的选择（例如「贴图改回文字」），不该被 localStorage 的记忆值覆盖。
function setActivePreset(id, params) {
  activePreset = null;
  logoDragging = false;      // 换模板/套配置后一律退出「照片 logo 拖动」模式
  const found = id ? (wmPresets || []).find(p => p.id === id) : null;
  if (id && !found) showToast(`未知模板：${id}`, 'error');
  if (!found) return null;
  // 复制一份参数当工作副本：模板定义保持只读，用户怎么调都不会污染它
  activePreset = { ...found, params: { ...(found.params || {}), ...(params || {}) } };
  if (!params) {
    (found.controls || []).forEach(c => {
      if (c.type === 'image_ref' && !activePreset.params[c.key]) {
        activePreset.params[c.key] = rememberedBrand(c.key);
      }
    });
  }
  const t = PRESET_KIND_TO_TYPE[found.kind];
  if (t) watermarkType = t;
  console.log('[wm] apply preset', found.id, activePreset.params);
  return activePreset;
}

function applyPreset(id) {
  setActivePreset(id, null);
  renderWatermark();
  if (currentImage) previewWatermark();
}

function filenameFromResponse(res, fallback) {
  const cd = res.headers.get('Content-Disposition') || '';
  const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
  if (star) return decodeURIComponent(star[1]);
  const plain = /filename="?([^";]+)"?/i.exec(cd);
  return plain ? plain[1] : fallback;
}

function bindExportControls() {
  const sel = $('#wmExportFormat');
  const q = $('#wmQuality');
  if (sel) sel.addEventListener('change', () => {
    wmExport.format = sel.value;
    updateExportHint();
    scheduleConfigSave();
  });
  if (q) {
    // 拖滑块 / 手输数字共用一套（数字框就是原来那个只读值）
    bindRangeNumber({
      range: q, num: $('#wmQualityNum'), decimals: 0,
      onCommit: () => { wmExport.quality = Number(q.value); scheduleConfigSave(); },
    });
    wmExport.quality = Number(q.value);
  }
  updateExportHint();
}

function updateExportHint() {
  const hint = $('#wmQualityHint');
  if (!hint) return;
  hint.textContent = wmExport.format === 'jpeg' ? '质量仅对 JPEG 生效，PNG 为无损导出'
    : wmExport.format === 'png' ? 'PNG 无损导出：像素不重编码，质量滑块不影响它'
      : '跟随上传时的格式；该格式若无法编码会自动回退 JPEG';
}

// Watermark rendering
function renderWatermark() {
  const container = $('#watermarkContent');
  const isText = watermarkType === 'text';
  const isImage = watermarkType === 'image';
  const isExif = watermarkType === 'exif';
  const isFrame = watermarkType === 'frame';
  const isBlur = watermarkType === 'blur';

  container.innerHTML = `
    <div class="wm-card">
      <div class="wm-card-head">
        <span class="wm-card-title">模板</span>
        <span class="wm-hint" style="margin:0">点一下套用，下面的旋钮可继续微调</span>
      </div>
      <div class="wm-preset-chips" id="wmPresetChips"></div>
      <div id="wmPresetControls"></div>
    </div>

    <div class="wm-card" id="wmConfigCard">
      <div class="wm-card-head">
        <span class="wm-card-title">配置</span>
        <span class="wm-cfg-status" id="wmConfigStatus" style="margin:0">参数会自动保存</span>
      </div>
      <div class="wm-group">
        <label>我的配置</label>
        <div class="wm-cfg-row">

let wmPos = { x: 0.5, y: 0.5 };
let debounceTimer = null;

function debouncedPreview() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(previewWatermark, 200);
  scheduleConfigSave();   // 同一批改动顺带防抖落盘（配置持久化，见「配置」一节）

// ---------------------------------------------------------------------------
// 图片水印 DOM 代理层
// 拖动/缩放只改前端状态（0 请求、即时反馈），点击「预览水印」或「下载图片」时
// 才把同一套归一化参数交给后端做权威合成，因此「预览所见 = 下载所得」。
// ---------------------------------------------------------------------------
const clamp01 = v => Math.min(1, Math.max(0, v));

function wmLayerEl() { return $('#wmLayer'); }
function selectedWmItem() { return wmItems.find(i => i.key === selectedWmKey) || null; }

function showWmLayer(rebuild = true) {
  const layer = wmLayerEl();
  if (!layer) return;
  if (watermarkType !== 'image') { hideWmLayer(); return; }

  const img = $('#previewImage');
  // 若当前显示的是服务端合成图，先切回无水印底图，避免水印叠加两遍
  if (currentImage && img && img.src !== currentImage) img.src = currentImage;
  layer.classList.add('active');
  if (rebuild) syncWmLayer(); else layoutWmLayer();
}

function hideWmLayer() {
  const layer = wmLayerEl();
  if (!layer) return;
  layer.classList.remove('active');
  layer.innerHTML = '';
}

function syncWmLayer() {
  const layer = wmLayerEl();
  if (!layer) return;
  layer.innerHTML = '';
  wmItems.forEach(it => layer.appendChild(buildWmNode(it)));
  layoutWmLayer();
}

function buildWmNode(it) {
  const node = document.createElement('div');
  node.className = 'wm-item' + (it.key === selectedWmKey ? ' selected' : '');
  node.dataset.key = it.key;
  node._wmItem = it;

  const img = document.createElement('img');
  img.src = it.src;
  img.alt = '';
  img.draggable = false;
  node.appendChild(img);

  const handle = document.createElement('div');
  handle.className = 'wm-handle';
  handle.title = '拖动缩放';
  node.appendChild(handle);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'wm-del';
  del.textContent = '×';
  del.title = '删除该水印';
  del.addEventListener('click', ev => { ev.stopPropagation(); removeWmItem(it.key); });
  node.appendChild(del);

  node.addEventListener('pointerdown', ev => {
    if (ev.button !== undefined && ev.button !== 0) return;
    if (ev.target === handle) { startWmResize(it, ev); return; }
    if (ev.target === del || del.contains(ev.target)) return;
    startWmDrag(it, ev);
  });
  return node;
}

// img 未设显式宽高（max-width/max-height + object-fit:contain），
// img 自身的盒子就是图片实际渲染区域：把代理层对齐到它，坐标即与后端一致。
function layoutWmLayer() {
  const layer = wmLayerEl();
  const box = $('#previewContainer');
  const img = $('#previewImage');
  if (!layer || !box || !img || !layer.classList.contains('active')) return;

  const ir = img.getBoundingClientRect();
  if (!ir.width || !ir.height) return;
  const cr = box.getBoundingClientRect();
  // 绝对定位的包含块是容器的 padding edge，故减去 border（本页为 0）
  layer.style.left = (ir.left - cr.left - box.clientLeft) + 'px';
  layer.style.top = (ir.top - cr.top - box.clientTop) + 'px';
  layer.style.width = ir.width + 'px';
  layer.style.height = ir.height + 'px';

  Array.from(layer.children).forEach(node => layoutWmNode(node._wmItem));
}

function layoutWmNode(it) {
  const layer = wmLayerEl();
  if (!layer || !it) return;
  const node = layer.querySelector(`.wm-item[data-key="${it.key}"]`);
  if (!node) return;
  const W = layer.clientWidth, H = layer.clientHeight;
  if (!W || !H) return;

  const w = Math.max(8, W * it.scale);
  const h = Math.max(8, w * ((it.natH || 1) / (it.natW || 1)));
  node.style.width = w + 'px';
  node.style.height = h + 'px';
  node.style.left = (it.x * W) + 'px';
  node.style.top = (it.y * H) + 'px';
  // Pillow 的 rotate 是逆时针，CSS 的 rotate 是顺时针，取负号保持方向一致
  node.style.transform = `translate(-50%, -50%) rotate(${-it.rotation}deg)`;
  node.classList.toggle('selected', it.key === selectedWmKey);

  const img = node.querySelector('img');
  if (img) img.style.opacity = String(Math.max(0.04, it.opacity / 255));
}

function selectWmItem(key) {
  selectedWmKey = key;
  const layer = wmLayerEl();
  if (layer) {
    Array.from(layer.children).forEach(n => n.classList.toggle('selected', n.dataset.key === key));
  }
  $$('.wm-list-item').forEach(el => el.classList.toggle('active', el.dataset.key === key));
  const it = selectedWmItem();
  if (it) syncWmItemPanel(it);
}

function startWmDrag(it, ev) {
  ev.preventDefault();
  selectWmItem(it.key);
  const layer = wmLayerEl();
  const r = layer.getBoundingClientRect();
  const startX = ev.clientX, startY = ev.clientY;
  const ox = it.x, oy = it.y;
  const move = e => {
    it.x = clamp01(ox + (e.clientX - startX) / (r.width || 1));
    it.y = clamp01(oy + (e.clientY - startY) / (r.height || 1));
    layoutWmNode(it);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    scheduleConfigSave();   // 拖完再落盘（拖动过程中不打扰）
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function startWmResize(it, ev) {
  ev.preventDefault();
  ev.stopPropagation();
  selectWmItem(it.key);
  const layer = wmLayerEl();
  const r = layer.getBoundingClientRect();
  // 以水印中心为锚点，按「指针到中心的距离」等比缩放
  const cx = r.left + it.x * r.width;
  const cy = r.top + it.y * r.height;
  const d0 = Math.max(1, Math.hypot(ev.clientX - cx, ev.clientY - cy));
  const base = it.scale;
  const move = e => {
    const d = Math.hypot(e.clientX - cx, e.clientY - cy);
    it.scale = Math.min(1, Math.max(0.02, base * d / d0));
    layoutWmNode(it);
    syncWmItemPanel(it);
    updateWmListNodeName(it);
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    scheduleConfigSave();   // 拖完再落盘（拖动过程中不打扰）
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function renderWmItemList() {
  const list = $('#wmList');
  if (!list) return;
  if (!wmItems.length) {
    list.innerHTML = '<div class="wm-hint" style="margin:0">还没有图片水印，点上面的按钮添加（可一次选多张）</div>';
    return;
  }
  list.innerHTML = wmItems.map((it, i) => `
    <div class="wm-list-item ${it.key === selectedWmKey ? 'active' : ''}" data-key="${it.key}">
      <img src="${it.src}" alt="">
      <span class="name">水印 ${i + 1} · ${Math.round(it.scale * 100)}%</span>
      <button type="button" class="del" data-del="${it.key}" title="删除">删除</button>
    </div>`).join('');

  list.querySelectorAll('.wm-list-item').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('[data-del]')) return;
      selectWmItem(el.dataset.key);
      showWmLayer(false);
    });
  });
  list.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); removeWmItem(el.dataset.del); });
  });
}

function updateWmListNodeName(it) {
  const idx = wmItems.indexOf(it);
  const nameEl = document.querySelector(`.wm-list-item[data-key="${it.key}"] .name`);
  if (nameEl && idx >= 0) nameEl.textContent = `水印 ${idx + 1} · ${wmItemScaleText(it.scale)}`;
}

// 缩放显示：一位小数（0.01 步长的滑块拖出来的值不再被四舍五入成整数）
function wmItemScaleText(scale) {
  return `${Math.round(Number(scale || 0) * 1000) / 10}%`;
}

function syncWmItemPanel(it) {
  if (!it) return;
  // 滑块（真值）与数字框（人话单位）一起写：数字框不是只读显示了，得同步
  const set = (id, rangeVal, displayVal) => {
    const el = $(`#${id}`);
    if (el) el.value = rangeVal;
    const num = $(`#${id}Num`);
    if (num) num.value = String(displayVal);
  };
  set('wmItemScale', roundTo(it.scale * 100, 2), roundTo(it.scale * 100, 2));
  set('wmItemRotation', Math.round(it.rotation), Math.round(it.rotation));
  set('wmItemOpacity', Math.round(it.opacity), Math.round(it.opacity / 255 * 100));
}

function bindWmItemSlider(id, apply, opts = {}) {
  bindRangeNumber({
    ...opts, range: $(`#${id}`), num: $(`#${id}Num`),
    onCommit: () => {
      const it = selectedWmItem();
      if (!it) return;
      apply(it, $(`#${id}`).value);
      showWmLayer(false);
      layoutWmNode(it);
      updateWmListNodeName(it);
      scheduleConfigSave();   // 缩放/旋转/透明度也是配置的一部分
    },
  });
}

async function removeWmItem(key) {
  const idx = wmItems.findIndex(i => i.key === key);
  if (idx < 0) return;
  const [it] = wmItems.splice(idx, 1);
  if (selectedWmKey === key) {
    selectedWmKey = wmItems.length ? wmItems[Math.min(idx, wmItems.length - 1)].key : null;
  }
  try {
    await fetch('/api/watermark/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: it.id }),
    });
  } catch (e) {
    /* 服务端删文件失败也不阻塞前端继续操作 */
  }
  renderWatermark();
  scheduleConfigSave();
  showToast('已删除该水印', '');
}

// 窗口缩放 / 图片尺寸变化时重新对齐代理层（仅在代理层显示中处理）
function relayoutWmLayer() {
  const layer = wmLayerEl();
  if (layer && layer.classList.contains('active')) layoutWmLayer();
  layoutLogoLayer();   // 自己判 .active，没显示就什么都不做
}
window.addEventListener('resize', relayoutWmLayer);
$('#previewImage').addEventListener('load', relayoutWmLayer);

// 正在看服务端合成图时，点一下预览图即可回到可拖动视图
$('#previewImage').addEventListener('pointerdown', () => {
  const layer = wmLayerEl();
  if (watermarkType !== 'image' || !wmItems.length) return;
  if (layer && layer.classList.contains('active')) return;  // 已经是可拖动视图，无需重建
  showWmLayer();
});

// 选中后 Delete/Backspace 删除（输入框里不拦截，避免影响正常文字编辑）
document.addEventListener('keydown', ev => {
  if (watermarkType !== 'image' || !selectedWmKey) return;
  if (ev.key !== 'Delete' && ev.key !== 'Backspace') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  ev.preventDefault();
  removeWmItem(selectedWmKey);
});

function getWmParams() {
  const activePos = $('.pos-btn.active');
  const isText = watermarkType === 'text';
  const isExif = watermarkType === 'exif';
  const isFrame = watermarkType === 'frame';
  const isBlur = watermarkType === 'blur';
  const params = {
    type: watermarkType,
    opacity: Number($('#wmOpacity')?.value || 128),
    position_x: Number(activePos?.dataset.x ?? 0.5),
    position_y: Number(activePos?.dataset.y ?? 0.5),
    rotation: Number($('#wmRotation')?.value || 0),
  };
  // 模板：把模板参数（含用户在动态控件里的改动）一并下发，后端按「显式 > 模板」合并
  if (presetActiveFor(watermarkType)) {
    params.preset = activePreset.id;
    Object.assign(params, activePreset.params);
  }
  if (isText) {
    const text = ($('#wmText')?.value || '').trim();
    if (!text) showToast('水印文字为空，将使用默认文字「水印」', '');
    params.text = text || '水印';
    params.font_size = Number($('#wmFontSize')?.value || 36);
    params.color = $('#wmColor')?.value || '#ffffff';
    params.bold = !!$('#wmBold')?.checked;
  } else if (isExif) {
    // 无模板时才发历史字段：它们会覆盖模板数值（bar_color/bar_opacity 同名）
    if (!params.preset) {
      params.font_size = Number($('#wmExifFontSize')?.value || 0);
      params.bar_color = $('#wmBarColor')?.value || '#ffffff';
      params.text_color = $('#wmTextColor')?.value || '#000000';
      params.bar_opacity = Number($('#wmOpacity')?.value || 240);
    }
  } else if (isFrame || isBlur) {
    // 画框水印 / 背景模糊都没有老前端字段：版式全部来自模板参数（上面的 Object.assign 已经带上）。
    // 没有模板就没有可画的几何量 ⇒ 明说一句，而不是发一个空 payload 让用户对着没变化的图发呆
    if (!params.preset) {
      showToast(`${CFG_TYPE_LABEL[watermarkType] || '该水印'}：请先在「模板」里选一个模板`, 'error');
      return null;
    }
  } else {
    if (!wmItems.length) { showToast('请先添加图片水印', 'error'); return null; }
    params.scale = 0.3;
    // 每张水印各自的位置/缩放/旋转/透明度：x,y 为中心点归一化坐标
    params.items = wmItems.map(it => ({
      id: it.id,
      x: Number(it.x.toFixed(5)),
      y: Number(it.y.toFixed(5)),
      scale: Number(it.scale.toFixed(5)),
      rotation: Number(it.rotation.toFixed(2)),
      opacity: Math.round(it.opacity),
    }));
  }
  return params;
}

async function previewWatermark() {
  if (!currentImage) { showToast('请先上传图片', 'error'); return; }
  scheduleConfigSave();   // 点「预览水印」也顺手落盘（拖动/贴图选择只走这条路）
  const params = getWmParams();
  if (!params) return;
  try {
    const res = await fetch('/api/watermark/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
    if (!res.ok || data.error) { showToast(data.error || `预览失败 (HTTP ${res.status})`, 'error'); return; }
    if (params.type === 'image') {
      // 服务端权威合成图：隐藏代理层避免水印叠两遍，点击预览图即可回来继续拖动
      hideWmLayer();
      showToast('以上为最终合成效果，点击预览图可继续拖动调整', '');
    }
    // 回显存一份：照片 logo 代理层要用 applied.frame.photo_box / canvas 做精确对齐
    lastApplied = data.applied || null;
    $('#previewImage').src = data.preview;
    if (data.applied) console.debug('[wm] applied', data.applied, params);
    // 拖动模式下让代理层保持可见（几何已按最新 applied 校准）；其余情况看服务端合成图，
    // 避免同一张 logo 在预览图上画两遍
    if (logoDragging && logoCanShow()) showLogoLayer(); else hideLogoLayer();
  } catch (e) {
    showToast('预览失败: ' + e.message, 'error');
  }
}

async function downloadWatermark() {
  if (!currentImage) { showToast('请先上传图片', 'error'); return; }
  const params = getWmParams();
  if (!params) return;
  // 导出选项：默认 jpeg/95 = 与历史完全一致的输出
  const payload = { ...params, format: wmExport.format, quality: wmExport.quality };
  try {
    const res = await fetch('/api/watermark/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      let msg = `下载失败 (HTTP ${res.status})`;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) { /* 非 JSON */ }
      showToast(msg, 'error');
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // 文件名以后端为准（PNG/原格式的扩展名不同），避免「选了 PNG 下来还是 .jpg」
    a.download = filenameFromResponse(res, `watermarked_image.${wmExport.format === 'png' ? 'png' : 'jpg'}`);
    a.click();
    URL.revokeObjectURL(url);
    showToast(`下载成功（${a.download}）`, 'success');
  } catch (e) {
    showToast('下载失败: ' + e.message, 'error');
  }
}

// Utils
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function showToast(msg, type) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ` ${type}` : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// 启动时拉一次模板列表与品牌贴图库（后面每次渲染水印面板都会用到），
// 再把上次自动保存的参数读回来（还没有底图就先存着，上传图片后 applyConfig 还原）
loadPresets();
loadBrands().then(() => { if (currentImage) renderPresetUI(); });
const wmConfigReady = loadConfig();
</script>
