<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="wm-version" content="preset-v4">
<title>图像 EXIF 编辑器 & 水印工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3345;
  --text: #e4e6ef;
  --text2: #8b8fa3;
  --accent: #6c5ce7;
  --accent2: #a29bfe;
  --danger: #e74c3c;
  --success: #2ecc71;
  --radius: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.app-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
}

.app-header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

.app-header .badge {
  font-size: 11px;
  padding: 2px 8px;
  background: var(--accent);
  color: #fff;
  border-radius: 10px;
}

.main-layout {
  display: grid;
  grid-template-columns: 1fr 400px;
  height: calc(100vh - 57px);
}

/* Left: Preview Area */
.preview-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.upload-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed var(--border);
  margin: 20px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  min-height: 300px;
}

.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: rgba(108, 92, 231, 0.05);
}

.upload-zone.has-image {
  border-style: solid;
  cursor: default;
  margin: 12px;
}

.upload-zone .placeholder {
  text-align: center;
  color: var(--text2);
}

.upload-zone .placeholder svg {
  width: 48px;
  height: 48px;
  margin-bottom: 12px;
  opacity: 0.4;
}

.upload-zone .placeholder p {
  font-size: 14px;
  margin-bottom: 4px;
}

.upload-zone .placeholder small {
  font-size: 12px;
  opacity: 0.6;
}

.preview-container {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 8px;
}

.preview-container img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 4px;
}

.image-info-bar {
  padding: 8px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: var(--text2);
}

.image-info-bar span { display: flex; align-items: center; gap: 4px; }

/* Right: Control Panel */
.control-panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.tab-btn {
  flex: 1;
  padding: 12px 16px;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}

.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }

.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* EXIF Panel */
.exif-section {
  margin-bottom: 20px;
}

.exif-section h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text2);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.exif-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
}

.exif-row label {
  color: var(--text2);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.exif-row input {
  width: 100%;
  padding: 5px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}

.exif-row input:focus { border-color: var(--accent); }

.exif-row input.binary {
  opacity: 0.5;
  cursor: not-allowed;
  font-style: italic;
}

/* 字段值单元格 + 来源/缺失徽章（身份字段缺失时也要留输入框，用户能直接补录） */
.exif-field {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.exif-field input { flex: 1; min-width: 0; }

.exif-row input.missing {
  border-style: dashed;
  color: var(--text2);
}

.exif-row input.missing::placeholder { color: #6b7085; }

.field-badge {
  flex: none;
  font-size: 10px;
  line-height: 1.6;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text2);
  white-space: nowrap;
  cursor: help;
}

.field-badge.src { color: var(--accent2); border-color: var(--accent2); }
.field-badge.missing { color: #e0a030; border-color: #e0a030; }

.exif-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

/* Watermark Panel */
.wm-group {
  margin-bottom: 16px;
}

.wm-group label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 6px;
  font-weight: 500;
}

.wm-group input[type="text"],
.wm-group select {
  width: 100%;
  padding: 8px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
}

.wm-group input[type="text"]:focus,
.wm-group input[type="number"]:focus,
.wm-group select:focus { border-color: var(--accent); }

.wm-slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wm-slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  outline: none;
}

.wm-slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* 数字手输框：与滑块同一数值口径（%/‰/px/°…），拖着调完可以直接敲数字 */
.wm-slider-row input.wm-num {
  flex: none;
  width: 64px;
  padding: 5px 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  outline: none;
}

.wm-slider-row input.wm-num:focus { border-color: var(--accent); }

.wm-slider-row .wm-unit {
  font-size: 12px;
  color: var(--text2);
  min-width: 16px;
}

.wm-color-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.wm-color-row input[type="color"] {
  width: 36px;
  height: 36px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  background: none;
  padding: 2px;
}

.wm-color-row .color-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.color-preset {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.15s;
}

.color-preset:hover { border-color: var(--text2); }

.wm-position-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  max-width: 150px;
}

.pos-btn {
  padding: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text2);
  font-size: 10px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.pos-btn:hover { border-color: var(--accent); color: var(--text); }
.pos-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.wm-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
}

.wm-checkbox input { accent-color: var(--accent); }

/* 模板（Preset）卡片：模板内容与控件描述都由后端下发，前端只负责画 */
.wm-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 16px;
}

.wm-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.wm-card-title { font-size: 12px; font-weight: 600; color: var(--text); }

.wm-preset-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.wm-preset-chip {
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.wm-preset-chip:hover { border-color: var(--accent); color: var(--text); }
.wm-preset-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.wm-preset-group { margin-top: 14px; }
.wm-preset-group .wm-group:last-child { margin-bottom: 0; }

.wm-preset-group-title {
  font-size: 11px;
  color: var(--accent2);
  letter-spacing: 0.6px;
  margin-bottom: 8px;
}

.wm-hint-inline { margin-left: 6px; font-weight: 400; font-size: 11px; color: var(--text2); }

/* 品牌贴图槽位：上=状态行（当前贴图 + 上传/用文字/删除），下=库缩略图条（点一下就套用） */
.wm-brand-state {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.wm-brand-thumb {
  width: auto;
  height: 26px;
  max-width: 96px;
  object-fit: contain;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px;
  flex: none;
}

.wm-brand-meta {
  flex: 1;
  min-width: 90px;
  font-size: 11px;
  color: var(--text2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wm-brand-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}

.wm-brand-pick {
  width: 46px;
  height: 32px;
  padding: 3px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  flex: none;
}

.wm-brand-pick img { width: 100%; height: 100%; object-fit: contain; display: block; }

.wm-brand-pick.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.28);
}

.wm-brand-add {
  width: 46px;
  height: 32px;
  padding: 0;
  background: none;
  border: 1px dashed var(--border);
  border-radius: 6px;
  color: var(--text2);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  flex: none;
}

.wm-brand-add:hover { border-color: var(--accent); color: var(--text); }

.wm-brand-empty { font-size: 11px; color: var(--text2); }

/* 字体槽位：下拉 + 上传/删除按钮同一行 */
.wm-font-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.wm-font-row select {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
}

.wm-mini-btn {
  padding: 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
  flex: none;
}

.wm-mini-btn:hover { border-color: var(--accent); color: var(--text); }
.wm-mini-btn.danger:hover { border-color: #e05252; color: #e05252; }
.wm-mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.wm-mini-btn:disabled:hover { border-color: var(--border); color: var(--text2); }

/* 配置卡片（自动保存槽 + 命名快照 + 导出/导入） */
.wm-cfg-row { display: flex; align-items: center; gap: 6px; }

.wm-cfg-row select,
.wm-cfg-row input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
}

.wm-cfg-status { font-size: 11px; color: var(--text2); white-space: nowrap; margin: 0; }
.wm-cfg-hint { margin-top: 10px; font-size: 11px; color: var(--text2); line-height: 1.6; }

/* 导出选项 */
.wm-export-row { display: flex; flex-direction: column; gap: 8px; }

/* Buttons */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.wm-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

/* Re-upload button */
.reupload-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 6px 12px;
  background: rgba(26, 29, 39, 0.85);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.reupload-btn:hover {
  border-color: var(--danger);
  color: var(--danger);
}

/* Watermark type toggle */
.wm-type-toggle {
  display: flex;
  flex-wrap: wrap;              /* 5 个类型按钮：窄面板下折一行，别挤成两字一行 */
  gap: 3px;
  background: var(--surface2);
  border-radius: var(--radius);
  padding: 3px;
  margin-bottom: 16px;
}

.wm-type-btn {
  flex: 1 1 68px;
  padding: 7px 6px;
  background: none;
  border: none;
  border-radius: 6px;
  color: var(--text2);
  font-size: 12.5px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
}

.wm-type-btn.active {
  background: var(--accent);
  color: #fff;
}

/* Watermark image upload */
.wm-upload-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.wm-upload-btn {
  flex: 1;
  padding: 10px;
  background: var(--surface2);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.wm-upload-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}

.wm-thumb {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  object-fit: contain;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: none;
}

.wm-remove-btn {
  padding: 4px 8px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}

.wm-remove-btn:hover {
  border-color: var(--danger);
  color: var(--danger);
}

/* ---------------------------------------------------------------------------
   图片水印 DOM 代理层：拖动/缩放全部在前端完成（0 请求、即时反馈），
   坐标与后端一致（x/y 为水印中心归一化坐标，scale 为占画布宽度比例），
   下载时才由后端按同一套参数做权威合成。
   --------------------------------------------------------------------------- */
.preview-container { position: relative; }

.wm-layer {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: none;
  pointer-events: none;
  z-index: 5;
  /* 真实位置/尺寸由 layoutWmLayer() 按 <img> 的 getBoundingClientRect 覆盖，
     因为父容器是 flex + padding 居中，图片盒子与容器内边缘并不重合。 */
}

.wm-layer.active { display: block; }

.wm-item {
  position: absolute;
  pointer-events: auto;
  cursor: move;
  transform-origin: center center;
  touch-action: none;
  user-select: none;
}

.wm-item img {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  -webkit-user-drag: none;
}

.wm-item.selected { outline: 1px dashed var(--accent); outline-offset: 2px; }

.wm-item .wm-handle {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid #fff;
  cursor: nwse-resize;
  touch-action: none;
}

.wm-item .wm-del {
  position: absolute;
  left: -9px;
  top: -9px;
  width: 18px;
  height: 18px;
  padding: 0;
  border-radius: 50%;
  background: rgba(26, 29, 39, 0.9);
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  display: none;
}

.wm-item.selected .wm-del { display: block; }
.wm-item .wm-del:hover { color: var(--danger); border-color: var(--danger); }

/* 已导入水印列表 */
.wm-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.wm-list-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
}

.wm-list-item.active { border-color: var(--accent); color: var(--text); }
.wm-list-item img { width: 26px; height: 26px; object-fit: contain; background: rgba(0, 0, 0, 0.25); border-radius: 4px; }
.wm-list-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wm-list-item .del {
  padding: 2px 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text2);
  font-size: 11px;
  cursor: pointer;
}
.wm-list-item .del:hover { color: var(--danger); border-color: var(--danger); }

.wm-hint {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.7;
  margin: -4px 0 12px;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text2);
  font-size: 13px;
}

.empty-state svg {
  width: 40px;
  height: 40px;
  margin-bottom: 12px;
  opacity: 0.3;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 10px 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text);
  transition: transform 0.3s;
  z-index: 100;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--danger); }
.toast.success { border-color: var(--success); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

@media (max-width: 800px) {
  .main-layout { grid-template-columns: 1fr; }
  .control-panel { border-left: none; border-top: 1px solid var(--border); max-height: 50vh; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1>EXIF & Watermark Studio</h1>
  <span class="badge">v1.0</span>
  <span class="badge" id="buildTag" title="前端构建号：排查“浏览器还在用旧页面”时对一眼"></span>
</header>

<div class="main-layout">
  <!-- Left: Preview -->
  <div class="preview-area">
    <div class="upload-zone" id="uploadZone">
      <div class="placeholder" id="uploadPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <p>拖拽图片到此处或点击上传</p>
        <small>支持 JPG / PNG / TIFF / WebP</small>
      </div>
      <div class="preview-container" id="previewContainer" style="display:none">
        <img id="previewImage" alt="Preview">
        <div class="wm-layer" id="wmLayer"></div>
        <div class="wm-layer" id="wmLogoLayer"></div>
        <button class="reupload-btn" id="reuploadBtn" title="清除当前图片并重新导入">重新导入</button>
      </div>
    </div>
    <div class="image-info-bar" id="infoBar" style="display:none">
      <span id="infoSize"></span>
      <span id="infoFormat"></span>
      <span id="infoMode"></span>
    </div>
  </div>

  <!-- Right: Controls -->
  <div class="control-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="exif">EXIF 参数</button>
      <button class="tab-btn" data-tab="watermark">水印编辑</button>
    </div>
    <div class="tab-content">
      <!-- EXIF Tab -->
      <div class="tab-pane active" id="tab-exif">
        <div id="exifContent">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <circle cx="12" cy="13" r="3"/>
            </svg>
            <p>上传图片后查看 EXIF 信息</p>
          </div>
        </div>
      </div>

      <!-- Watermark Tab -->
      <div class="tab-pane" id="tab-watermark">
        <div id="watermarkContent">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
            </svg>
            <p>上传图片后编辑水印</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="wmFileInput" accept="image/*" multiple style="display:none">

<script>
// 构建标记：排查“浏览器用的还是旧版页面”这类问题时，控制台一眼可见
// 注意：index.html 由 Flask 模板缓存，改完**必须重启服务**才生效（除非开了 TEMPLATES_AUTO_RELOAD）。
const WM_BUILD = 'preset-v14';
console.log('[wm] build', WM_BUILD);
const buildTag = document.getElementById('buildTag');
if (buildTag) buildTag.textContent = WM_BUILD;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let currentImage = null;   // 预览底图 data URL（不含任何水印叠加）
let imageInfo = null;      // 原图信息（width/height/format）——品牌贴图「建议 ≥N px 高」提示要用原图宽
let exifData = {};
let watermarkType = 'text';
// 图片水印（可多张）：{ key, id, src, natW, natH, x, y, scale, rotation, opacity }
// x/y = 水印中心归一化坐标(0~1)；scale = 占画布宽度比例；rotation = 角度(与后端 Pillow 同向)
let wmItems = [];
let selectedWmKey = null;
let wmSeq = 0;

// 模板（Preset）：列表与控件描述都来自后端 /api/watermark/presets。
// activePreset.params 是「当前工作副本」——滑块改动只动它，不改后端下发的模板定义。
let wmPresets = [];
let activePreset = null;
// 导出选项（只影响下载；默认 jpeg/95 与历史行为一致）
let wmExport = { format: 'jpeg', quality: 95 };
// 模板 kind（决定参数表）→ 水印 type（决定渲染分支），与后端 _PRESET_KIND_TO_TYPE 对应
const PRESET_KIND_TO_TYPE = { exif_bar: 'exif', photo_frame: 'frame', blur_backdrop: 'blur', text: 'text', image: 'image' };
const PRESET_CHOICE_LABELS = {
  append: '追加白条（画布加高）',
  overlay: '压在照片下沿（画布不变）',
  columns: '左右分栏（参照图版式）',
  stacked: '居中竖排（品牌在上、参数在下）',
  auto: '跟随版式',
  left: '居左',
  center: '居中',
  right: '居右',
  top: '靠上',
  middle: '居中',
  bottom: '靠下',
};
// 品牌贴图库：后端 brands/ 目录里的长期资源（跨会话保留、reset 不清），
// 模板参数用贴图 id 引用它 ⇒ 信息栏的「厂商文字」可以换成自己上传的 logo。
let wmBrands = [];
const BRAND_CHOICE_KEY = 'wm.brand.choices';   // 记住「某个槽位上次选了哪张」，下次自动带回

async function loadPresets() {
  try {
    const res = await fetch('/api/watermark/presets');
    const data = await res.json();
    wmPresets = data.presets || [];
    (wmPresets || []).forEach(p => {
      if (p.invalid_params && p.invalid_params.length) {
        console.warn('[wm] 模板', p.id, '里有被忽略的键:', p.invalid_params);
      }
    });
    console.log('[wm] presets', wmPresets.map(p => p.id), '控件数', wmPresets.map(p => (p.controls || []).length));
  } catch (e) {
    wmPresets = [];
  }
  // 还没上传图片时保持原样的空状态，上传后 renderWatermark() 会带上模板卡片
  if (currentImage) renderWatermark();
}

// 品牌贴图列表：贴图是长期资源，页面一打开就拉一次，控件里的下拉框据此生成
async function loadBrands() {
  try {
    const res = await fetch('/api/brand/list');
    const data = await res.json();
    wmBrands = Array.isArray(data.items) ? data.items : [];
    // 后端会把「直接丢进 brands/ 目录的散图」收编进库（库只认 brand_<id>.png 文件名），
    // 收编了就说一声，免得用户以为：① 我的文件被删了 ② 列表怎么自己多了一张
    const adopted = Array.isArray(data.adopted) ? data.adopted : [];
    if (adopted.length) {
      const names = wmBrands.filter(b => adopted.includes(b.id)).map(b => b.name).join('、');
      showToast(`已把 brands/ 目录里的 ${adopted.length} 张图收编进贴图库：${names}`, 'success');
    }
  } catch (e) {
    wmBrands = [];   // 贴图库读不到不影响其它功能，只是缩略图条里没得选
  }
  console.log('[wm] brands', wmBrands.map(b => `${b.id}:${b.name}`));
  return wmBrands;
}

function brandChoices() {
  try { return JSON.parse(localStorage.getItem(BRAND_CHOICE_KEY) || '{}') || {}; } catch (e) { return {}; }
}

function saveBrandChoice(key, id) {
  try {
    const all = brandChoices();
    all[key] = id || '';
    localStorage.setItem(BRAND_CHOICE_KEY, JSON.stringify(all));
  } catch (e) { /* 隐私模式等 localStorage 不可用时忽略：只是记不住选择 */ }
}

// ---------------------------------------------------------------------------
// 字体槽位（信息栏四段文字 + 全局字体）：选项由后端下发（系统字体已按本机文件存在
// 过滤 + 我上传的字体），前端只负责渲染、以及上传/删除后**原地更新 options** ——
// 绝不重新 applyPreset：那会重建工作副本，把用户已经调好的参数全部冲掉。
// ---------------------------------------------------------------------------
const FONT_UPLOAD_GROUP = '我上传的';
let fontFileInput = null;

function fontOptionsHtml(c, cur) {
  const opts = Array.isArray(c.options) ? c.options : [];
  const groups = new Map();
  opts.forEach(o => {
    const g = o.group || '';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(o);
  });
  let html = '';
  for (const [g, list] of groups) {
    const inner = list.map(o => {
      const v = String(o.value);
      return `<option value="${escapeHtml(v)}" ${v === cur ? 'selected' : ''}>${escapeHtml(String(o.label))}</option>`;
    }).join('');
    html += g ? `<optgroup label="${escapeHtml(g)}">${inner}</optgroup>` : inner;
  }
  if (cur && !opts.some(o => String(o.value) === cur)) {
    // 引用的字体不在了（删掉 / 换了机器）：留一行占位，别让它悄悄变成「自动」还查不出原因
    html += `<option value="${escapeHtml(cur)}" selected>${escapeHtml(cur)}（不在字体库里）</option>`;
  }
  return html;
}

function isUploadedFont(c, id) {
  if (!id) return false;
  // 只看本控件的选项：选项就是后端下发的那份，比全局扫一遍更可靠（渲染时选项一定在手上）
  return ((c && c.options) || []).some(o =>
    String(o.value) === id && o.group === FONT_UPLOAD_GROUP);
}

function fontStateText(c, cur) {
  if (!cur) return '当前：自动（按文字语言挑选字体）';
  const found = (c.options || []).find(o => String(o.value) === cur);
  if (!found) return `当前：${cur}（不在字体库里，预览会回落到自动字体）`;
  return `当前：${found.label}${found.group === FONT_UPLOAD_GROUP ? '（我上传的字体）' : ''}`;
}

// 上传/删除后原地刷新字体选项；模板定义与工作副本一起更新（两边引用同一批控件对象）
function applyFontList(fonts) {
  if (!Array.isArray(fonts)) return;
  (wmPresets || []).forEach(p => (p.controls || []).forEach(c => {
    if (c.type === 'font_ref') c.options = fonts;
  }));
  if (activePreset) (activePreset.controls || []).forEach(c => {
    if (c.type === 'font_ref') c.options = fonts;
  });
}

function pickFontFile(key) {
  if (!fontFileInput) {
    fontFileInput = document.createElement('input');
    fontFileInput.type = 'file';
    fontFileInput.accept = '.ttf,.otf,.ttc,.ttf2,font/*';
    fontFileInput.style.display = 'none';
    document.body.appendChild(fontFileInput);
  }
  fontFileInput.value = '';
  fontFileInput.onchange = () => {
    const f = fontFileInput.files && fontFileInput.files[0];
    if (f) uploadFontFile(f, key);
  };
  fontFileInput.click();
}

async function uploadFontFile(file, key) {
  if (file.size > 20 * 1024 * 1024) { showToast('字体文件超过 20MB 上限', 'error'); return; }
  showToast('正在导入字体...', '');
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/font/upload', { method: 'POST', body: form });
    let data = {};
    try { data = await res.json(); } catch (e) { /* 非 JSON 响应（例如 413 HTML） */ }
    if (!res.ok || data.error) { showToast(data.error || `导入失败 (HTTP ${res.status})`, 'error'); return; }
    applyFontList(data.fonts);
    if (activePreset && key) activePreset.params[key] = data.id;   // 传完直接给这个槽位套上
    renderPresetUI();
    showToast(`字体已导入：${data.name || data.id}`, 'success');
    if (currentImage) previewWatermark();
  } catch (e) {
    showToast('字体导入失败: ' + e.message, 'error');
  }
}

async function removeFontFile(id) {
  if (!id) return;
  if (!window.confirm('删除这个字体？用到它的模板会自动回落到自动字体。')) return;
  try {
    const res = await fetch('/api/font/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (data.error) { showToast(data.error, 'error'); return; }
    applyFontList(data.fonts);
  } catch (e) {
    showToast('删除失败: ' + e.message, 'error');
    return;
  }
  // 引用了这个字体的槽位一律清空（回落自动）：参数绝不指向已经不存在的 id
  if (activePreset) {
    Object.keys(activePreset.params).forEach(k => {
      if (activePreset.params[k] === id) activePreset.params[k] = '';
    });
  }
  renderPresetUI();
  showToast('字体已删除', '');
  if (currentImage) previewWatermark();
}

// 记住的选择只在「贴图还在库里」时带回来，否则空串（照旧用文字）
function rememberedBrand(key) {
  const id = brandChoices()[key];
  return id && wmBrands.some(b => b.id === id) ? id : '';
}

// ---------------------------------------------------------------------------
// 配置持久化：服务端 configs/current.json = 自动保存槽；configs/<id>.json = 命名快照
//
// 语义只有一条：**当前生效的配置永远只有一份**（服务端的 current）。
// 前端只做两件事：
//   ① collectConfig()  —— 把界面上的参数收成一个配置对象 → 防抖 POST /api/config/save
//   ② applyConfig(cfg) —— 把配置写回界面（模板 / 类型 / 控件 / 图片水印位置）
// 于是「调完参数刷新页面还在」「导出 → 改乱 → 导入 → 一模一样」都靠这一条约定；
// 合法化（范围夹紧、未知键丢弃、模板是否存在）只在后端 _normalize_config 一个入口，
// 前端不做第二套校验，避免两边规则漂移。
// 配置文件里只放参数与引用 id（模板/贴图/字体/图片水印），图片文件本身不进配置。
// ---------------------------------------------------------------------------
let wmConfig = null;        // 上次读到的「当前配置」：上传图片后据此还原界面
let wmConfigSlots = [];     // 命名快照清单（下拉切换用）
let wmConfigTimer = null;   // 自动保存防抖
let wmConfigBusy = false;   // 正在套用/导入/恢复默认：这期间不自动保存（否则会自己盖自己）
let wmConfigStamp = 0;      // 服务端 current.json 的 mtime（页面上显示「已自动保存 …」）
let wmConfigError = '';         // 自动保存失败原因（非空 = 状态行变红：目录只读这类问题一眼可见）
let wmConfigSaveWarned = false; // 失败 toast 只弹一次，别让 600ms 防抖刷屏
let wmConfigJsonOpen = false;   // 「查看 JSON」面板是否展开（这卡片会被重建，得记在变量里）
const CFG_TYPES = ['text', 'image', 'exif', 'frame', 'blur'];
const CFG_TYPE_LABEL = { text: '文字', image: '图片', exif: '信息栏', frame: '画框水印', blur: '背景模糊' };
const CFG_EXPORT_FORMATS = ['jpeg', 'png', 'original'];

// 界面状态 → 配置对象。字段与后端 _normalize_config 一一对应（text/exif/legacy 是
// 老前端那套固定字段，params 是模板参数；两者都要存，切回模板/切回默认风格都不丢）。
function collectConfig() {
  const params = {};
  if (activePreset) Object.assign(params, activePreset.params);
  const pos = $('.pos-btn.active');
  const val = id => { const el = $(`#${id}`); return el ? el.value : ''; };
  return {
    type: watermarkType,
    preset: activePreset ? activePreset.id : '',
    params,
    text: {
      text: val('wmText'),
      font_size: Number(val('wmFontSize') || 36),
      color: val('wmColor') || '#ffffff',
      bold: !!($('#wmBold') && $('#wmBold').checked),
    },
    exif: {
      font_size: Number(val('wmExifFontSize') || 0),
      bar_color: val('wmBarColor') || '#ffffff',
      text_color: val('wmTextColor') || '#000000',
      bar_opacity: Number(val('wmOpacity') || 240),
    },
    legacy: {
      position_x: Number(pos ? pos.dataset.x : 0.5),
      position_y: Number(pos ? pos.dataset.y : 0.5),
      rotation: Number(val('wmRotation') || 0),
      opacity: Number(val('wmOpacity') || 128),
    },
    export: { format: wmExport.format, quality: Number(wmExport.quality) },
    image: { items: wmItems.map(cfgItemOf) },
  };
}

// 图片水印只存「引用 id + 几何量」：图片文件在 uploads/watermark_<id>.png 里
function cfgItemOf(it) {
  return {
    id: it.id,
    x: roundTo(it.x, 5),
    y: roundTo(it.y, 5),
    scale: roundTo(it.scale, 5),
    rotation: roundTo(it.rotation, 2),
    opacity: Math.round(it.opacity),
  };
}

// 面板重建后把配置值写回控件。数字框显示的是「人话单位」（透明度是 %），
// 要跟滑块一起写 —— 滑块是唯一真值来源，数字框只是它的显示。
function setRangeAndNum(id, rangeVal, numVal) {
  const r = $(`#${id}`);
  if (r) r.value = String(rangeVal);
  const n = $(`#${id}Num`);
  if (n) n.value = String(numVal == null ? rangeVal : numVal);
}

function applyConfigFields(cfg) {
  const t = cfg.text || {}, e = cfg.exif || {}, l = cfg.legacy || {};
  if ($('#wmText')) $('#wmText').value = t.text || '';
  setRangeAndNum('wmFontSize', finiteNum(t.font_size, 36));
  if ($('#wmColor')) $('#wmColor').value = t.color || '#ffffff';
  if ($('#wmBold')) $('#wmBold').checked = !!t.bold;
  setRangeAndNum('wmExifFontSize', finiteNum(e.font_size, 0));
  if ($('#wmBarColor')) $('#wmBarColor').value = e.bar_color || '#ffffff';
  if ($('#wmTextColor')) $('#wmTextColor').value = e.text_color || '#000000';
  // 透明度滑块在文字水印与信息栏之间是共用的（老页面就这一个），按当前类型取对应那份
  const opacity = watermarkType === 'exif' ? finiteNum(e.bar_opacity, 240) : finiteNum(l.opacity, 128);
  const opClamped = Math.min(255, Math.max(10, Math.round(opacity)));
  setRangeAndNum('wmOpacity', opClamped, roundTo(opClamped / 255 * 100, 0));
  setRangeAndNum('wmRotation', finiteNum(l.rotation, 0));
  // 位置按钮：命中九宫格才点亮；配置里的值不在网格上就保持原样（手改文件才会遇到）
  $$('.pos-btn').forEach(b => {
    b.classList.toggle('active',
      Math.abs(Number(b.dataset.x) - finiteNum(l.position_x, 0.5)) < 1e-6
      && Math.abs(Number(b.dataset.y) - finiteNum(l.position_y, 0.5)) < 1e-6);
  });
  const sel = $('#wmExportFormat');
  if (sel) sel.value = wmExport.format;
  setRangeAndNum('wmQuality', wmExport.quality);
  updateExportHint();
  // 图片水印：几何量已经在 wmItems 上，这里把列表与滑块同步过来
  syncWmItemPanel(selectedWmItem());
  renderWmItemList();
}

// 套用配置：先按配置改状态（类型/模板/导出选项/图片水印几何），再重建面板，
// 最后把文字、信息栏这些**只活在 DOM 里**的值写回控件 —— 顺序不能反，
// renderWatermark() 会按模板里的默认 value 重建输入框，先写就白写了。
// 返回没能还原的图片水印数量（配置文件里引用的图片已经不在 uploads/ 里）。
function applyConfig(cfg) {
  if (!cfg) return 0;
  wmConfigBusy = true;
  let missing = 0;
  try {
    watermarkType = CFG_TYPES.includes(cfg.type) ? cfg.type : watermarkType;
    // 模板不在库里就按「不用模板」处理（后端 likewise 清空 preset 并回 preset_missing 警告）
    const presetId = cfg.preset && (wmPresets || []).some(p => p.id === cfg.preset) ? cfg.preset : '';
    if (cfg.preset && !presetId) console.warn('[cfg] 模板不在库里，按不用模板处理:', cfg.preset);
    setActivePreset(presetId, cfg.params || {});
    const exp = cfg.export || {};
    wmExport.format = CFG_EXPORT_FORMATS.includes(exp.format) ? exp.format : 'jpeg';
    wmExport.quality = Math.min(100, Math.max(1, finiteNum(exp.quality, 95)));
    // 图片水印：按 id 找到当前列表里的那几张，复原位置/缩放/旋转/透明度
    const wanted = (cfg.image && Array.isArray(cfg.image.items)) ? cfg.image.items : [];
    wanted.forEach(ci => {
      const it = wmItems.find(i => i.id === ci.id);
      if (!it) { missing++; return; }
      it.x = clamp01(finiteNum(ci.x, it.x));
      it.y = clamp01(finiteNum(ci.y, it.y));
      it.scale = Math.min(1, Math.max(0.02, finiteNum(ci.scale, it.scale)));
      it.rotation = finiteNum(ci.rotation, it.rotation);
      it.opacity = Math.round(finiteNum(ci.opacity, it.opacity));
    });
    if (selectedWmKey && !wmItems.some(i => i.key === selectedWmKey)) {
      selectedWmKey = wmItems.length ? wmItems[0].key : null;
    }
    renderWatermark();       // 面板按新状态重建（类型/模板/导出选项都跟着变）
    applyConfigFields(cfg);  // 再把「只存在 DOM 里」的值写回去
    console.log('[cfg] applied', cfg, 'missing_items', missing);
  } finally {
    wmConfigBusy = false;    // 复原过程中不许自动保存，否则会把自己刚套上的数据盖回去
  }
  if (currentImage) previewWatermark();
  return missing;
}

// ---- 自动保存 --------------------------------------------------------------
// 任何参数改动最终都会走到这里（滑块/手输/颜色/文字/模板控件/贴图/字体/拖动水印），
// 防抖 600ms 落盘 current.json —— 用户感觉不到请求，刷新页面参数还在。
function scheduleConfigSave() {
  if (!currentImage || wmConfigBusy) return;   // 没有底图就没什么可存的
  clearTimeout(wmConfigTimer);
  wmConfigTimer = setTimeout(saveConfigNow, 600);
}

async function saveConfigNow() {
  if (!currentImage || wmConfigBusy) return;
  clearTimeout(wmConfigTimer);
  try {
    const res = await fetch('/api/config/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config: collectConfig() }),
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    wmConfig = data.config;
    wmConfigStamp = Number(data.saved_at || 0);
    wmConfigError = '';              // 存上了就把上一次的失败提示清掉
    wmConfigSaveWarned = false;
    renderConfigStatus();
    if (data.invalid_params && data.invalid_params.length) {
      console.warn('[cfg] 自动保存时被忽略的键:', data.invalid_params);
    }
  } catch (err) {
    // 自动保存失败必须显式暴露：部署目录只读 / 磁盘满时，光 console.warn 用户看不见，
    // 会一直以为「参数已自动保存」，直到点导出才发现服务器上根本没有那份配置。
    console.warn('[cfg] 自动保存失败', err);
    wmConfigError = err.message || '自动保存失败';
    renderConfigStatus();
    if (!wmConfigSaveWarned) {
      wmConfigSaveWarned = true;
      showToast('参数自动保存失败: ' + wmConfigError, 'error');
    }
  }
}

// ---- 命名快照 + 导出/导入 ---------------------------------------------------
// 下拉里显示「名字 · 模板/类型 · 时间」；清单由服务端 index.json 维护（清单丢了就用 id 当名字）
function configSlotLabel(s) {
  const kind = s.preset_name ? `模板「${s.preset_name}」` : (CFG_TYPE_LABEL[s.type] || '未设置类型');
  const when = s.saved_at_text ? ` · ${s.saved_at_text.slice(5, 16)}` : '';
  return `${s.name} · ${kind}${when}`;
}

function selectedConfigSlotId() {
  const sel = $('#wmConfigSlot');
  return sel ? sel.value : '';
}

function renderConfigStatus() {
  const el = $('#wmConfigStatus');
  if (!el) return;
  if (wmConfigError) {
    el.textContent = `自动保存失败：${wmConfigError}`;   // 显式报出来，别只躺在控制台里
    el.style.color = '#e05252';
    return;
  }
  el.style.color = '';
  if (!wmConfigStamp) { el.textContent = '参数会自动保存'; return; }
  const d = new Date(wmConfigStamp * 1000);
  const hhmmss = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
  el.textContent = `已自动保存 ${hhmmss}`;
}

// 选中一套配置时「保存」按钮变成「覆盖保存」，这样「新建一套」与「更新已有的一套」
// 都是显式动作，不靠记快捷键
function updateConfigButtons() {
  const has = !!selectedConfigSlotId();
  ['wmConfigApply', 'wmConfigDelete'].forEach(id => {
    const b = $(`#${id}`);
    if (b) b.disabled = !has;
  });
  const nameEl = $('#wmConfigName');
  const typed = nameEl ? nameEl.value.trim() : '';
  const saveBtn = $('#wmConfigSaveAs');
  if (saveBtn) {
    const overwrite = has && !typed;
    saveBtn.textContent = overwrite ? '覆盖保存' : '保存';
    saveBtn.title = overwrite ? '用当前参数覆盖选中的那套配置' : '把当前这套参数存成一个命名配置';
  }
}

// 下拉选项重画；能保留的选择就保留（做完一次操作别把选择跳掉）
function renderConfigUI(slots) {
  if (slots) wmConfigSlots = slots;
  const sel = $('#wmConfigSlot');
  if (sel) {
    const keep = sel.value;
    sel.innerHTML = '<option value="">（选择已保存的配置）</option>'
      + (wmConfigSlots || []).map(s =>
        `<option value="${escapeHtml(s.id)}">${escapeHtml(configSlotLabel(s))}</option>`).join('');
    sel.value = (wmConfigSlots || []).some(s => s.id === keep) ? keep : '';
  }
  renderConfigStatus();
  updateConfigButtons();
}

// 后端回显的告警 / 被丢弃的键 / 没找到文件的图片水印 —— 一律说出来，不静默
function reportConfigNotes(data, missing) {
  const notes = [];
  const bad = (data && data.invalid_params) || [];
  if (bad.length) {
    notes.push(`被忽略的参数：${bad.join('、')}`);
    console.warn('[cfg] 被忽略的键:', bad);
  }
  ((data && data.warnings) || []).forEach(w => {
    const s = String(w);
    if (s.indexOf('preset_missing:') === 0) {
      notes.push(`模板「${s.slice('preset_missing:'.length).trim()}」已不在库里，已按不用模板处理`);
    } else if (s.indexOf('migrated_v11:') === 0) {
      // v11 的老配置会被搬成「画框水印」；搬不动的键也在这里点名（绝不静默丢参数）
      notes.push(s.slice('migrated_v11:'.length).trim());
    } else {
      notes.push(s);
    }
  });
  if (missing > 0) notes.push(`配置里 ${missing} 张图片水印的图片已不在 uploads/，已跳过`);
  if (notes.length) showToast(notes.join('；'), '');
  return notes;
}

async function configPost(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// 「切换」= 把快照拷回服务端 current 并套到界面上（current 永远是唯一真源）
async function applyConfigSlot() {
  const id = selectedConfigSlotId();
  if (!id) { showToast('请先选择一套配置', 'error'); return; }
  try {
    const data = await configPost('/api/config/apply', { slot: id });
    wmConfig = data.config;
    wmConfigStamp = Number(data.saved_at || wmConfigStamp);
    const missing = applyConfig(data.config);
    reportConfigNotes(data, missing);
    showToast('已切换到该配置', 'success');
  } catch (err) {
    showToast('切换失败: ' + err.message, 'error');
  }
}

// 「保存」= 把**当前画面这一套**另存成命名快照。overwrite=true 覆盖下拉里选中的那套
// （名字沿用输入框的内容，留空就用原名字），否则按新名字新建。
async function saveConfigSlot(overwrite) {
  const nameEl = $('#wmConfigName');
  const slotId = overwrite ? selectedConfigSlotId() : '';
  const current = (wmConfigSlots || []).find(s => s.id === slotId);
  const typed = nameEl ? nameEl.value.trim() : '';
  const name = typed || (current ? current.name : '');
  if (!name) { showToast('请先给这套参数起个名字', 'error'); return; }
  if (!overwrite && typed && (wmConfigSlots || []).some(s => s.name === typed)) {
    showToast(`已经有一套叫「${typed}」的配置了，换个名字或选中它再覆盖保存`, 'error');
    return;
  }
  try {
    // 存的是前端当前状态（服务端 current 可能还在 600ms 防抖里没落盘）
    const data = await configPost('/api/config/slots/save', {
      name, config: collectConfig(), id: slotId,
    });
    if (nameEl) nameEl.value = '';
    renderConfigUI(data.slots);
    const sel = $('#wmConfigSlot');
    if (sel && data.id) { sel.value = data.id; updateConfigButtons(); }
    reportConfigNotes(data, 0);
    showToast(overwrite ? `已更新配置「${data.name}」` : `已保存配置「${data.name}」`, 'success');
  } catch (err) {
    showToast('保存失败: ' + err.message, 'error');
  }
}

async function deleteConfigSlot() {
  const id = selectedConfigSlotId();
  if (!id) { showToast('请先选择一套配置', 'error'); return; }
  const slot = (wmConfigSlots || []).find(s => s.id === id);
  if (!window.confirm(`删除配置「${slot ? slot.name : id}」？当前画面不受影响。`)) return;
  try {
    const data = await configPost('/api/config/slots/delete', { id });
    renderConfigUI(data.slots);
    showToast('已删除该配置', '');
  } catch (err) {
    showToast('删除失败: ' + err.message, 'error');
  }
}

// 导出前先落盘：自动保存有 600ms 防抖，「刚改完就导出」否则会漏掉最后那一下。
// 走 fetch + blob（与「下载图片」同一套路），不再用锚点跳转：锚点拿不到响应状态，
// 宿主环境禁掉下载时会静默失败、提示照弹「已导出」（历史故障）。
async function exportConfig() {
  await saveConfigNow();
  try {
    const res = await fetch('/api/config/export');
    if (!res.ok) {
      let msg = `导出失败 (HTTP ${res.status})`;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) { /* 非 JSON：保留 HTTP 文案 */ }
      showToast(msg + '；已打开 JSON 面板，可直接复制', 'error');
      await openConfigJson();
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // 文件名以后端为准（带时间戳），与「下载图片」同一个取法
    a.download = filenameFromResponse(res, 'watermark-cfg.json');
    a.click();
    URL.revokeObjectURL(url);
    showToast(`已导出配置（${a.download}）`, 'success');
  } catch (err) {
    showToast('导出失败: ' + err.message + '；已打开 JSON 面板，可直接复制', 'error');
    await openConfigJson();
  }
}

// 「查看 JSON」：取 ?inline=1 的正文填进只读文本框。为什么必须有这条路 —— 有的部署环境 /
// 预览 iframe 直接禁掉下载，导出文件永远到不了手；而导入接口认的就是这段 JSON 文本，
// 复制走、存成文件、再导入 = 与下载文件完全等价（两条互为备份的通道）。
async function openConfigJson() {
  const box = $('#wmConfigJson');
  const ta = $('#wmConfigJsonText');
  if (!box || !ta) return;
  wmConfigJsonOpen = true;
  box.style.display = '';
  ta.value = '正在读取…';
  await saveConfigNow();                 // 先把最后那一下改动落盘，免得复制到旧参数
  try {
    const res = await fetch('/api/config/export?inline=1');
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) { /* 非 JSON */ }
      ta.value = `读取失败：${msg}`;
      showToast('读取配置失败: ' + msg, 'error');
      return;
    }
    const text = await res.text();
    ta.value = text;
    try { JSON.parse(text); } catch (e) { showToast('配置内容不是合法 JSON', 'error'); }
  } catch (err) {
    ta.value = '读取失败：' + err.message;
    showToast('读取配置失败: ' + err.message, 'error');
  }
}

function closeConfigJson() {
  wmConfigJsonOpen = false;
  const box = $('#wmConfigJson');
  if (box) box.style.display = 'none';
}

function selectConfigJson() {
  const ta = $('#wmConfigJsonText');
  if (ta) { ta.focus(); ta.select(); }
}

async function copyConfigJson() {
  const ta = $('#wmConfigJsonText');
  if (!ta) return;
  if (!ta.value || ta.value === '正在读取…') await openConfigJson();
  const text = ta.value;
  if (!text) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      ta.focus(); ta.select();
      document.execCommand('copy');     // 非 https / 老浏览器兜底
    }
    showToast('配置 JSON 已复制到剪贴板', 'success');
  } catch (err) {
    ta.focus(); ta.select();            // 自动复制被拦：至少全选好，让用户自己 Ctrl+C
    showToast('浏览器不允许自动复制，已全选，按 Ctrl+C 即可', 'error');
  }
}

function openConfigJsonTab() {
  // 新标签打开同一份 JSON：标签页里 Ctrl+S 也能另存，绕开预览环境的下载拦截
  window.open('/api/config/export?inline=1', '_blank');
}

async function importConfigFile(file) {
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/config/import', { method: 'POST', body: form });
    let data = {};
    try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    wmConfig = data.config;
    wmConfigStamp = Number(data.saved_at || 0);
    const missing = applyConfig(data.config);
    renderConfigUI(data.slots);
    reportConfigNotes(data, missing);
    showToast(`已导入配置（${data.filename || '配置文件'}）`, 'success');
  } catch (err) {
    showToast('导入失败: ' + err.message, 'error');
  }
}

// 「恢复默认」= 删掉自动保存的那一份 + 界面回到页面初始状态（命名快照保留）
async function clearConfig() {
  if (!window.confirm('恢复默认会清掉自动保存的这套参数（已命名的配置保留），继续？')) return;
  let removed = false;
  try {
    const data = await configPost('/api/config/clear', {});
    removed = !!data.removed;
  } catch (err) {
    showToast('恢复默认失败: ' + err.message, 'error');
    return;
  }
  wmConfigBusy = true;
  try {
    watermarkType = 'text';
    activePreset = null;
    wmExport = { format: 'jpeg', quality: 95 };
    renderWatermark();           // 面板按页面默认值重建 = 初始状态
    wmConfig = collectConfig();  // 之后上传图片按「默认配置」还原（等于什么都不改）
    // busy 还是 true ⇒ 这次预览不会顺手把默认值又写回 current.json
    if (currentImage) previewWatermark();
  } finally {
    wmConfigBusy = false;
  }
  wmConfigStamp = 0;
  renderConfigUI();
  showToast(removed ? '已恢复默认参数' : '本来就没有自动保存的参数', '');
}

// 配置卡片是 renderWatermark() 每次重建的 DOM，因此每次都要重新绑一遍
function bindConfigControls() {
  if (!$('#wmConfigSlot')) return;
  renderConfigUI();
  $('#wmConfigSlot').addEventListener('change', updateConfigButtons);
  $('#wmConfigApply').addEventListener('click', applyConfigSlot);
  $('#wmConfigDelete').addEventListener('click', deleteConfigSlot);
  $('#wmConfigExport').addEventListener('click', exportConfig);
  $('#wmConfigImport').addEventListener('click', () => $('#wmConfigFile').click());
  // 「查看 JSON」面板：下载被宿主禁掉时的第二条通道（复制走 → 存文件 → 导入）
  const cfgViewBtn = $('#wmConfigView');
  if (cfgViewBtn) cfgViewBtn.addEventListener('click', openConfigJson);
  const cfgTabBtn = $('#wmConfigJsonTab');
  if (cfgTabBtn) cfgTabBtn.addEventListener('click', openConfigJsonTab);
  const cfgCopyBtn = $('#wmConfigJsonCopy');
  if (cfgCopyBtn) cfgCopyBtn.addEventListener('click', copyConfigJson);
  const cfgSelBtn = $('#wmConfigJsonSelect');
  if (cfgSelBtn) cfgSelBtn.addEventListener('click', selectConfigJson);
  const cfgCloseBtn = $('#wmConfigJsonClose');
  if (cfgCloseBtn) cfgCloseBtn.addEventListener('click', closeConfigJson);
  if (wmConfigJsonOpen) openConfigJson();   // 卡片被重建时把展开状态带回来
  $('#wmConfigClear').addEventListener('click', clearConfig);
  const nameEl = $('#wmConfigName');
  nameEl.addEventListener('input', updateConfigButtons);   // 按钮在「保存/覆盖保存」之间切换
  // 一个按钮两种用法：选着某套配置且没输新名字 = 覆盖它，否则按输入的名字新建
  const saveCurrent = () => saveConfigSlot(!!selectedConfigSlotId() && !nameEl.value.trim());
  $('#wmConfigSaveAs').addEventListener('click', saveCurrent);
  nameEl.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    saveCurrent();
  });
  const file = $('#wmConfigFile');
  file.addEventListener('change', () => {
    const picked = file.files && file.files[0];
    file.value = '';            // 清空后同一个文件也能再次导入
    importConfigFile(picked);
  });
}

// 打开页面就把「上次那套参数」读回来；还没有底图时先放着，上传图片后 applyConfig 还原。
async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const data = await res.json();
    wmConfig = data.exists ? data.config : null;
    wmConfigSlots = Array.isArray(data.slots) ? data.slots : [];
    wmConfigStamp = Number(data.saved_at || 0);
    const notes = reportConfigNotes(data, 0);
    console.log('[wm] config', data.exists ? 'restored' : 'empty', wmConfig, notes);
    // 用户手速快（配置还在路上就传完图）时面板已经画好了 ⇒ 这里补一次清单
    if ($('#wmConfigSlot')) renderConfigUI();
    return data;
  } catch (e) {
    console.warn('[cfg] 读取配置失败', e);
    return null;
  }
}
